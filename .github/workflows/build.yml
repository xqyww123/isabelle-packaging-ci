name: build

# Reusable workflow: packages the OFFICIAL Isabelle release, its sources unmodified.
#
# Job A   — ubuntu-latest: download the official platform bundles and check them
#           against releases/<release>/SHA256SUMS, the checksums the Isabelle site
#           publishes, registered here once per release.  Upstream is downloaded from
#           once per run; every later job takes its bundle from Job A's artifacts.
# Job B   — ubuntu-latest: turn each bundle, its own Pure/HOL heaps included, into a
#           conda package (one per conda subdir), checking that the package is the
#           official tree plus the packaging changes (scripts/check_pristine.py).  It
#           VERIFIES by installing from a local channel; it does NOT publish.  Publishing
#           to R2 lives in release.yml, so that a push can never move the channel
#           (PACKAGING_DESIGN.md §5.4).
# Job C-E — install and run the packages on the platforms they are for.

on:
  workflow_call:
    inputs:
      release:
        description: "Isabelle release, e.g. Isabelle2026 (must be registered in releases/)"
        type: string
        required: true
      build_number:
        description: "conda build number -- becomes the package's build string (isabelle-<version>-<N>)"
        type: string
        required: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: >-
          Claude subscription token (`claude setup-token`) for the GUI checks.
          Optional: without it the screenshot is still taken and uploaded, and only
          the AI judgement is skipped.  A reusable workflow gets NO secrets unless
          they are declared here AND passed by the caller (`secrets: inherit`).
          NB deliberately not ANTHROPIC_API_KEY -- that outranks the OAuth token in
          Claude Code's auth chain and would bill the metered API instead of the
          subscription.
        required: false

jobs:
  bundles:
    name: "Job A - official bundles (download + SHA256)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE: ${{ inputs.release }}
      DL: ${{ github.workspace }}/dl
    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4
        with:
          path: ci

      - name: Download the official platform bundles
        run: |
          set -euo pipefail
          SUMS="ci/releases/$RELEASE/SHA256SUMS"
          [ -f "$SUMS" ] || { echo "::error::$RELEASE is not registered: no releases/$RELEASE/ (add its SHA256SUMS and ISABELLE_ID)"; exit 1; }
          mkdir -p "$DL"
          while read -r _ f; do
            echo "=== $f ==="
            curl -fsS --retry 5 --retry-delay 20 -o "$DL/$f" "https://isabelle.in.tum.de/website-$RELEASE/dist/$f"
            ls -l "$DL/$f"
          done < "$SUMS"
          cd "$DL" && sha256sum -c "$GITHUB_WORKSPACE/$SUMS"

      # One artifact PER BUNDLE (not one 7 GB blob): each heap job needs exactly one of
      # them, and actions/download-artifact cannot fetch a single file out of a larger
      # artifact.  Artifact names use the official platform names.
      - name: Upload bundle (linux)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.release }}-bundle-linux
          path: ${{ github.workspace }}/dl/${{ inputs.release }}_linux.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload bundle (linux_arm)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.release }}-bundle-linux_arm
          path: ${{ github.workspace }}/dl/${{ inputs.release }}_linux_arm.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload bundle (macos)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.release }}-bundle-macos
          path: ${{ github.workspace }}/dl/${{ inputs.release }}_macos.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload bundle (macos_arm)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.release }}-bundle-macos_arm
          path: ${{ github.workspace }}/dl/${{ inputs.release }}_macos_arm.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload bundle (windows .exe)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.release }}-bundle-windows
          path: ${{ github.workspace }}/dl/${{ inputs.release }}.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # ===========================================================================
  # Job B: conda packaging.
  #
  # Everything happens on Linux, for every target platform -- including win-64.
  # Nothing is compiled here; we unpack and zip the result into a .conda
  # (PACKAGING_DESIGN.md §5.0).
  #
  # Mapping bundle -> conda subdir (the official platform names on the right):
  #
  #   linux-64       <- linux
  #   linux-aarch64  <- linux_arm
  #   osx-64         <- macos
  #   osx-arm64      <- macos_arm
  #   win-64         <- windows
  #
  # This job PUBLISHES NOTHING.  It verifies the packages against a local channel and
  # uploads them as an artifact; release.yml is what pushes them to R2.
  # ===========================================================================
  conda:
    name: "Job B - conda packages (all subdirs)"
    needs: bundles
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RELEASE: ${{ inputs.release }}
      CH: ${{ github.workspace }}/channel      # local channel, for verification only
      OUT: ${{ github.workspace }}/out
      # pack.sh requires both; the build number becomes the conda build string.
      # (release.yml passes its build_number input here.)
      ISA_RELEASE: ${{ inputs.release }}
      ISA_BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4

      - name: Disk assertion (+ cleanup only if needed)
        run: |
          set -euo pipefail
          df -h /
          avail=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "free on / = ${avail} GB"
          # Peak here: 5 bundles (~7 GB) + one unpacked tree (~3 GB)
          # + one $PREFIX copy (~3 GB) + 5 finished .conda (~6 GB).  We unpack and
          # package ONE platform at a time and delete the staging in between.
          if [ "$avail" -lt 60 ]; then
            echo "::warning::free disk below threshold - running cleanup"
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                        /usr/local/.ghcup /usr/local/share/powershell \
                        /usr/share/swift /usr/local/share/chromium \
                        /opt/hostedtoolcache/CodeQL || true
            df -h /
          fi

      - name: Install 7-Zip + rattler-build
        run: |
          set -euo pipefail
          # 7-Zip: to unpack Job A's Windows SFX .exe.
          # !! The binary is `7z` on Debian/Ubuntu, NOT `7zz`.  `7zz` is upstream 7-Zip's
          # !! (and conda-forge's) name; Ubuntu's `7zip` package installs /usr/bin/7z.
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends 7zip

          # A REAL assertion.  The previous version of this line was
          #     7zz i > /dev/null && echo "7zz: ..."
          # which is a FAKE guard: under `set -e`, a command that is not the last in an
          # && list is exempt from errexit, so `7zz: command not found` was swallowed and
          # this step went GREEN with no 7-Zip at all.  The build then died 25 minutes
          # later inside pack.sh, on the fifth and last package.  Guards must be written
          # so that they can actually fail.
          command -v 7zz >/dev/null || command -v 7z >/dev/null || {
            echo "::error::no 7-Zip binary found (tried 7zz and 7z)"; exit 1; }
          echo "7-Zip: $(command -v 7zz || command -v 7z)"

          # rattler-build: a single static binary.  conda-build is in maintenance mode
          # and takes minutes where this takes seconds (PACKAGING_DESIGN.md §3.3).
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/rb.tar.gz \
            https://github.com/prefix-dev/rattler-build/releases/latest/download/rattler-build-x86_64-unknown-linux-musl.tar.gz
          tar xzf /tmp/rb.tar.gz -C /tmp
          mv /tmp/rattler-build-x86_64-unknown-linux-musl/rattler-build "$HOME/.local/bin/"
          chmod +x "$HOME/.local/bin/rattler-build"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/rattler-build" --version

      - name: Download all bundles (Job A)
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.release }}-bundle-*
          path: ${{ runner.temp }}/bundles

      - name: Survey the inputs
        run: |
          set -euo pipefail
          echo "===== bundles ====="; find "$RUNNER_TEMP/bundles" -type f -printf '%10s  %p\n'

      - name: "Build the conda packages"
        run: |
          set -euo pipefail
          B="$RUNNER_TEMP/bundles"
          export WORK="$RUNNER_TEMP/pack"
          # check_pristine.py reads the .conda's zstd members: the runner's Miniconda has
          # the zstandard module, its system python3 does not.
          export PYTHON="$CONDA/bin/python"

          # subdir | official platform name (bundle artifact) | file inside the bundle artifact
          for spec in \
            "linux-64      linux      ${RELEASE}_linux.tar.gz" \
            "linux-aarch64 linux_arm  ${RELEASE}_linux_arm.tar.gz" \
            "osx-64        macos      ${RELEASE}_macos.tar.gz" \
            "osx-arm64     macos_arm  ${RELEASE}_macos_arm.tar.gz" \
            "win-64        windows    ${RELEASE}.exe"
          do
            set -- $spec
            subdir=$1; platform=$2; file=$3
            echo "::group::$subdir"
            scripts/pack.sh \
              --subdir "$subdir" \
              --bundle "$B/$RELEASE-bundle-$platform/$file" \
              --out    "$OUT"
            # reclaim the unpacked tree + the build prefix before the next platform
            rm -rf "$WORK/stage" "$OUT/bld"
            df -h / | tail -1
            echo "::endgroup::"
          done

      - name: "All five packages present?"
        run: |
          set -euo pipefail
          fail=0
          for s in linux-64 linux-aarch64 osx-64 osx-arm64 win-64; do
            f=$(ls "$OUT/$s"/isabelle-*.conda 2>/dev/null || true)
            if [ -n "$f" ]; then
              printf '  OK    %-14s %s (%s)\n' "$s" "$(basename "$f")" "$(du -h "$f" | cut -f1)"
            else
              echo "::error::no package for $s"; fail=1
            fi
          done
          exit $fail

      # -------------------------------------------------------------------------
      # Verify against a LOCAL channel: deterministic, no CDN in the way
      # (PACKAGING_DESIGN.md §5.4).  conda-forge is named too, for python (recipe.yaml
      # says why).  Only linux-64 can actually be RUN here -- the other four are
      # cross-targets and this runner cannot execute them.
      # -------------------------------------------------------------------------
      - name: "Index a local channel and install linux-64 from it"
        run: |
          set -euo pipefail
          # The runner's preinstalled Miniconda is ROOT-owned; without this, both the
          # `conda install` below and the package cache that `conda create` writes to
          # ($CONDA/pkgs) fail with EACCES.
          sudo chown -R "$(id -u):$(id -g)" "$CONDA"
          $CONDA/bin/conda install -y -n base -c conda-forge conda-index -q

          mkdir -p "$CH/noarch"
          for s in linux-64 linux-aarch64 osx-64 osx-arm64 win-64; do
            mkdir -p "$CH/$s"; cp "$OUT/$s"/isabelle-*.conda "$CH/$s/"
          done
          # --no-zst: Cloudflare caches repodata.json.zst for 4h but never the plain
          # .json, and conda prefers the .zst -> a fresh publish would be invisible for
          # hours.  (PACKAGING_DESIGN.md §3.3)
          $CONDA/bin/python -m conda_index "$CH" --no-zst --no-bz2 --channeldata \
            --channel-name conda.qiyuan.me

          echo "===== what the channel advertises ====="
          # Informational only -- must not be able to fail the step.  Uses .get() and a
          # trailing `|| true`, matching its hardened macOS twin (the "what the channel
          # advertises" block in Job C): a diagnostic print of channel contents must never
          # red a job whose packages are already built and indexed correctly.
          $CONDA/bin/python - <<'PY' || true
          import json, pathlib, os
          ch = pathlib.Path(os.environ["CH"])
          for sub in sorted(p.name for p in ch.iterdir() if p.is_dir()):
              rd = ch / sub / "repodata.json"
              if not rd.exists(): continue
              for fn, m in json.load(rd.open()).get("packages.conda", {}).items():
                  print(f"  {sub:14s} {m['name']}-{m['version']}-{m['build']}  depends={m.get('depends')}")
          PY

          echo "===== conda create from the local channel ====="
          $CONDA/bin/conda create -y -p "$RUNNER_TEMP/isaenv" \
            -c "file://$CH" -c conda-forge --override-channels isabelle

      - name: "Run the installed Isabelle (this is the actual proof)"
        run: |
          set -euo pipefail
          ENV="$RUNNER_TEMP/isaenv"
          export PATH="$ENV/bin:$PATH"

          echo "--- conda sees it ---"
          $CONDA/bin/conda list -p "$ENV" isabelle

          echo "--- bin/isabelle is the relative symlink into isa/ ---"
          ls -l "$ENV/bin/isabelle"

          echo "--- isabelle version ---"
          isabelle version

          echo "--- ISABELLE_HOME must resolve INTO the conda prefix ---"
          # $PREFIX/isa, not $PREFIX/opt/<release>: those 15 characters are charged
          # against Windows' MAX_PATH on every file in the package (see conda/recipe.yaml).
          # Isabelle does not care -- ISABELLE_HOME is derived from bin/isabelle's own
          # location, never from this directory's name.
          home=$(isabelle getenv -b ISABELLE_HOME)
          echo "ISABELLE_HOME = $home"
          [ "$home" = "$ENV/isa" ] || { echo "::error::ISABELLE_HOME is $home, expected $ENV/isa"; exit 1; }

          echo "--- the prebuilt heaps shipped INSIDE the package ---"
          ls -l "$home"/heaps/*/ "$home"/heaps/*/log/

          # -------------------------------------------------------------------------
          # The heap must actually be USED.  Build a one-line session on top of Main and
          # assert that HOL is NOT recompiled.
          #
          # Do NOT "verify" this with `isabelle build -n` (a dry run).  It is a FALSE
          # PASS: with the session databases missing it still printed nothing to build,
          # while a real build turned around and recompiled the whole of HOL.  Only a
          # real build tells the truth.
          # -------------------------------------------------------------------------
          P="$RUNNER_TEMP/probe"; mkdir -p "$P"
          printf 'theory T imports Main begin\nlemma "(2::nat) + 2 = 4" by simp\nend\n' > "$P/T.thy"
          printf 'session Probe = HOL +\n  theories T\n' > "$P/ROOT"

          echo "--- building a session that imports Main ---"
          t0=$(date +%s)
          isabelle build -d "$P" Probe 2>&1 | tee "$RUNNER_TEMP/probe.log"
          echo "took $(( $(date +%s) - t0 ))s"

          if grep -q 'Building HOL' "$RUNNER_TEMP/probe.log"; then
            echo "::error::Isabelle REBUILT HOL -- the shipped heap was not used."
            echo "          Almost certainly heaps/<ML_ID>/log/*.db did not make it into"
            echo "          the package; without the session database the heap is ignored."
            exit 1
          fi
          grep -q 'Finished Probe' "$RUNNER_TEMP/probe.log" || {
            echo "::error::the probe session did not build"; exit 1; }
          echo "  -> HOL was NOT rebuilt: the prebuilt heap in the package was loaded."

      - name: "Two environments of the same name get their own user directory"
        run: |
          set -euo pipefail
          # scripts/pack.sh 1d: the suffix carries a hash of the whole prefix path.
          for d in a b; do
            $CONDA/bin/conda create -y -q -p "$RUNNER_TEMP/$d/env" \
              -c "file://$CH" -c conda-forge --override-channels isabelle > /dev/null
          done
          ua=$("$RUNNER_TEMP/a/env/bin/isabelle" getenv -b ISABELLE_HOME_USER)
          ub=$("$RUNNER_TEMP/b/env/bin/isabelle" getenv -b ISABELLE_HOME_USER)
          echo "a/env -> $ua"; echo "b/env -> $ub"
          [ "$ua" != "$ub" ] || { echo "::error::two environments named env share $ua"; exit 1; }
          case "$ua" in
            */.isabelle/"$RELEASE"-conda-env-*) ;;
            *) echo "::error::unexpected user directory $ua"; exit 1 ;;
          esac
          rm -rf "$RUNNER_TEMP/a" "$RUNNER_TEMP/b"

      - name: "The isabelle post-link re-runs its dependents' post-links"
        run: |
          set -euo pipefail
          scripts/check_rerun.sh build "$RUNNER_TEMP/probe-channel"
          mkdir -p "$RUNNER_TEMP/probe-channel/linux-64"
          cp "$CH"/linux-64/isabelle-*.conda "$RUNNER_TEMP/probe-channel/linux-64/"
          $CONDA/bin/python -m conda_index "$RUNNER_TEMP/probe-channel" --no-zst --no-bz2
          scripts/check_rerun.sh run "$CONDA/bin/conda" "file://$RUNNER_TEMP/probe-channel" "$RUNNER_TEMP/probe-env"
          rm -rf "$RUNNER_TEMP/probe-env"

      - name: Upload the post-link probe (for Job E)
        uses: actions/upload-artifact@v4
        with:
          name: rerun-probe
          path: ${{ runner.temp }}/probe-channel/noarch/isabelle-rerun-probe-*.conda
          if-no-files-found: error
          retention-days: 7

      # -------------------------------------------------------------------------
      # The GUI is the one thing no headless assertion reaches: every check above
      # passes on a package whose jEdit dies on startup.  So: run jEdit under Xvfb on
      # a theory with one lemma that must succeed and one that must fail, screenshot
      # it, and have Claude Code look at the pixels.  The verdict is the DISCRIMINATING
      # pair -- an error marker on exactly the bad line -- because "a window appeared"
      # is satisfied by an empty frame.  See scripts/verify_gui.sh for the reasoning
      # (notably: it pins ML_system_64 from the shipped heap's name, or jEdit silently
      # rebuilds HOL in a dialog and the screenshot goes falsely green).
      # -------------------------------------------------------------------------
      - name: Install GUI-check deps (Xvfb, xdotool, ImageMagick)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11-utils xdotool imagemagick
          for t in Xvfb xdpyinfo xdotool import jq; do
            command -v "$t" >/dev/null || { echo "::error::missing $t"; exit 1; }
          done

      - name: "GUI verification: start jEdit and have Claude Code judge the screenshot"
        env:
          # OAuth (subscription) token ONLY.  Never add ANTHROPIC_API_KEY here.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: scripts/verify_gui.sh "$RUNNER_TEMP/isaenv" "$RUNNER_TEMP/gui"

      - name: Upload the GUI screenshot + verdict
        if: always()          # on failure this IS the evidence -- upload it either way
        uses: actions/upload-artifact@v4
        with:
          name: gui-verification
          path: |
            ${{ runner.temp }}/gui/jedit.png
            ${{ runner.temp }}/gui/verdict.json
            ${{ runner.temp }}/gui/jedit.log
            ${{ runner.temp }}/gui/claude.err
            ${{ runner.temp }}/gui/xvfb.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload the conda packages
        uses: actions/upload-artifact@v4
        with:
          name: conda-packages
          path: ${{ github.workspace }}/out/*/isabelle-*.conda
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # ===========================================================================
  # Jobs C, D and E: INSTALL AND RUN the packages Job B built, on the platforms they
  # are actually for.
  #
  # Job B can only run what it builds on: linux-64.  The other four are cross-built
  # from Linux; these jobs run them natively:
  #
  #   Job C  macos-15          osx-arm64      (+ the GUI check)
  #   Job C  macos-15-intel    osx-64
  #   Job D  ubuntu-24.04-arm  linux-aarch64  (+ the GUI check)
  #   Job E  windows-latest    win-64         (+ the post-link re-run, in .bat)
  #
  # All consume Job B's `conda-packages` artifact, so what is installed here is the
  # EXACT byte-for-byte package that would be published -- not a rebuild of it.
  #
  # The load-bearing assertion in C and D is the same one as in Job B, for the same
  # reason: build a real session on top of Main and require that HOL is NOT recompiled.
  # `isabelle build -n` must never be used for this -- it is a FALSE PASS (with the
  # session databases missing it happily reports nothing to build, while a real build
  # turns around and rebuilds the whole of HOL).
  # ===========================================================================

  install-macos:
    name: "Job C - install + run (${{ matrix.subdir }}, ${{ matrix.runner }})"
    needs: conda
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - subdir: osx-arm64
            runner: macos-15
            miniforge: Miniforge3-MacOSX-arm64.sh
          - subdir: osx-64
            runner: macos-15-intel
            miniforge: Miniforge3-MacOSX-x86_64.sh
    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4

      - name: Free up disk (drop the extra Xcodes)
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /Applications/Xcode_*.app || true
          df -h /

      - name: Download the conda packages (Job B)
        uses: actions/download-artifact@v4
        with:
          name: conda-packages
          path: ${{ runner.temp }}/pkgs

      - name: Build a local channel with just the ${{ matrix.subdir }} package
        run: |
          set -euo pipefail
          CH="$RUNNER_TEMP/channel"
          S=${{ matrix.subdir }}
          mkdir -p "$CH/noarch" "$CH/$S"
          [ -d "$RUNNER_TEMP/pkgs/$S" ] || { echo "::error::Job B produced no $S package"; exit 1; }
          cp "$RUNNER_TEMP/pkgs/$S"/isabelle-*.conda "$CH/$S/"
          rm -rf "$RUNNER_TEMP/pkgs"
          ls -lh "$CH/$S"
          echo "CH=$CH" >> "$GITHUB_ENV"

          # Miniforge rather than the preinstalled $CONDA: it exists on every runner we
          # use, and it is ours (no root-owned prefix to chown).
          curl -fsSL -o "$RUNNER_TEMP/mf.sh" \
            https://github.com/conda-forge/miniforge/releases/latest/download/${{ matrix.miniforge }}
          bash "$RUNNER_TEMP/mf.sh" -b -p "$HOME/mf"
          "$HOME/mf/bin/conda" install -y -q -c conda-forge conda-index
          "$HOME/mf/bin/python" -m conda_index "$CH" --no-zst --no-bz2 --channeldata \
            --channel-name conda.qiyuan.me

      - name: "${{ matrix.subdir }}: install and RUN"
        run: |
          set -euo pipefail
          ENV="$RUNNER_TEMP/isaenv"
          "$HOME/mf/bin/conda" create -y -p "$ENV" -c "file://$CH" -c conda-forge --override-channels isabelle
          scripts/verify_install.sh "$ENV"

      # ---------------------------------------------------------------------
      # The real macOS GUI check: start jEdit on the runner's own window server and let
      # Claude Code judge the screenshot.  Same criteria as Linux -- both call the shared
      # scripts/gui_judge.sh -- only the launch is macOS-specific (Quartz +
      # screencapture, no Xvfb).
      #
      # arm64 only, on purpose: jEdit is the same Quartz code on both Mac architectures,
      # and osx-64's CLI + heap + platform resolution are covered by its own
      # install-and-run step above.
      - name: "GUI verification (osx-arm64): jEdit + Claude Code judge"
        if: matrix.subdir == 'osx-arm64'
        env:
          # OAuth (subscription) token ONLY.  Never add ANTHROPIC_API_KEY here.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: scripts/verify_gui_macos.sh "$RUNNER_TEMP/isaenv" "$RUNNER_TEMP/gui"

      - name: Upload the macOS GUI screenshot + verdict
        if: always() && matrix.subdir == 'osx-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: macos-gui
          path: |
            ${{ runner.temp }}/gui/jedit.png
            ${{ runner.temp }}/gui/verdict.json
            ${{ runner.temp }}/gui/jedit.log
            ${{ runner.temp }}/gui/claude.err
          if-no-files-found: warn
          retention-days: 7

  install-linux-arm:
    name: "Job D - install + run + GUI (linux-aarch64)"
    needs: conda
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4

      - name: Download the conda packages (Job B)
        uses: actions/download-artifact@v4
        with:
          name: conda-packages
          path: ${{ runner.temp }}/pkgs

      - name: Build a local channel with just the linux-aarch64 package
        run: |
          set -euo pipefail
          CH="$RUNNER_TEMP/channel"
          mkdir -p "$CH/noarch" "$CH/linux-aarch64"
          [ -d "$RUNNER_TEMP/pkgs/linux-aarch64" ] || { echo "::error::Job B produced no linux-aarch64 package"; exit 1; }
          cp "$RUNNER_TEMP/pkgs/linux-aarch64"/isabelle-*.conda "$CH/linux-aarch64/"
          rm -rf "$RUNNER_TEMP/pkgs"
          ls -lh "$CH/linux-aarch64"
          echo "CH=$CH" >> "$GITHUB_ENV"

          curl -fsSL -o "$RUNNER_TEMP/mf.sh" \
            https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-aarch64.sh
          bash "$RUNNER_TEMP/mf.sh" -b -p "$HOME/mf"
          "$HOME/mf/bin/conda" install -y -q -c conda-forge conda-index
          "$HOME/mf/bin/python" -m conda_index "$CH" --no-zst --no-bz2 --channeldata \
            --channel-name conda.qiyuan.me

      - name: "linux-aarch64: install and RUN"
        run: |
          set -euo pipefail
          ENV="$RUNNER_TEMP/isaenv"
          "$HOME/mf/bin/conda" create -y -p "$ENV" -c "file://$CH" -c conda-forge --override-channels isabelle
          scripts/verify_install.sh "$ENV"
          echo "ENV=$ENV" >> "$GITHUB_ENV"

      - name: Install GUI-check deps (Xvfb, xdotool, ImageMagick)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11-utils xdotool imagemagick
          for t in Xvfb xdpyinfo xdotool import jq; do
            command -v "$t" >/dev/null || { echo "::error::missing $t"; exit 1; }
          done

      # The same GUI check as Job B, on ARM.  jEdit is a JVM app and the bundle carries an
      # arm64 JDK, so this should just work -- but "should" is exactly the word that has
      # been wrong every time in this pipeline, so we run it.
      - name: "GUI verification on ARM: jEdit under Xvfb, judged by Claude Code"
        env:
          # OAuth (subscription) token ONLY.  Never add ANTHROPIC_API_KEY here.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: scripts/verify_gui.sh "$ENV" "$RUNNER_TEMP/gui"

      - name: Upload the ARM GUI screenshot + verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-verification-arm
          path: |
            ${{ runner.temp }}/gui/jedit.png
            ${{ runner.temp }}/gui/verdict.json
            ${{ runner.temp }}/gui/jedit.log
            ${{ runner.temp }}/gui/claude.err
            ${{ runner.temp }}/gui/xvfb.log
          if-no-files-found: warn
          retention-days: 7

  install-windows:
    name: "Job E - install + run + post-link re-run (win-64)"
    needs: conda
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -l {0}     # setup-miniconda puts conda on PATH via the login profile
    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4

      - name: Download the conda packages (Job B)
        uses: actions/download-artifact@v4
        with:
          name: conda-packages
          path: ${{ runner.temp }}/pkgs

      - name: Download the post-link probe (Job B)
        uses: actions/download-artifact@v4
        with:
          name: rerun-probe
          path: ${{ runner.temp }}/probe

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-activate-base: true
          activate-environment: ""

      - name: Build a local channel with the win-64 package and the probe
        run: |
          set -euo pipefail
          T="$(cygpath -m "$RUNNER_TEMP")"        # D:/a/_temp: a form both bash and conda read
          CH="$T/channel"
          mkdir -p "$CH/noarch" "$CH/win-64"
          [ -d "$T/pkgs/win-64" ] || { echo "::error::Job B produced no win-64 package"; exit 1; }
          cp "$T/pkgs/win-64"/isabelle-*.conda "$CH/win-64/"
          cp "$T/probe"/isabelle-rerun-probe-*.conda "$CH/noarch/"
          rm -rf "$T/pkgs"
          conda install -y -q -n base -c conda-forge conda-index
          python -m conda_index "$CH" --no-zst --no-bz2
          echo "T=$T" >> "$GITHUB_ENV"

      - name: "win-64: install, run, and re-run the post-links (.bat)"
        run: |
          set -euo pipefail
          ENV="$T/isaenv"
          scripts/check_rerun.sh run "$CONDA_EXE" "file:///$T/channel" "$ENV"
          v=$("$ENV/Scripts/isabelle.bat" version)
          echo "isabelle version -> $v"
          [ -n "$v" ] || { echo "::error::isabelle version printed nothing"; exit 1; }
          u=$("$ENV/Scripts/isabelle.bat" getenv -b ISABELLE_HOME_USER | tr -d '\r')
          echo "ISABELLE_HOME_USER = $u"
          # scripts/pack.sh 1d, through Isabelle's own Cygwin (cksum included)
          case "$u" in
            */.isabelle/*-conda-isaenv-[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "::error::unexpected user directory $u"; exit 1 ;;
          esac
