# The download counter of conda.qiyuan.me: index.js. Pausing and resuming it:
# scripts/download-counter.py. The counts: `wrangler d1 execute conda-downloads --remote
# --command "SELECT * FROM downloads"`.
#
# Deploy with `wrangler deploy` here, giving wrangler a token minted with
# CLOUDFLARE_GOD_KEY (CHANNEL_OPERATIONS.md, "CLOUDFLARE_GOD_KEY") and
# CLOUDFLARE_ACCOUNT_ID, never secret.sh's CLOUDFLARE_API_TOKEN. The token needs Workers
# Scripts Write, D1 Write, Workers Tail Read and Account Settings Read on the account, and
# Workers Routes Write and Zone Read on all zones of the account (with one zone only,
# wrangler keeps the Worker's old routes).
#
# The route fails open: past the free plan's daily request limit, requests skip the Worker
# instead of getting error 1027. That is the route's request_limit_fail_open in
# /zones/<zone id>/workers/routes, and every `wrangler deploy` recreates the route with it
# off: after each deploy, GET the route's new id there and PUT it back with
# {"pattern": "conda.qiyuan.me/*", "script": "conda-download-counter",
# "request_limit_fail_open": true}, using the deploy token.
name = "conda-download-counter"
main = "index.js"
compatibility_date = "2026-10-01"
routes = [{ pattern = "conda.qiyuan.me/*", zone_name = "qiyuan.me" }]

[[d1_databases]]
binding = "DB"
database_name = "conda-downloads"
