name: release

# Publish the conda packages to our channel at https://conda.qiyuan.me (R2 bucket `conda`).
#
# Publishing is deliberately NOT a side effect of pushing (PACKAGING_DESIGN.md §5.4):
# once a package is on the channel a user may already have pulled it, so it can neither
# be deleted nor overwritten.  You get here only by pressing the button: a tag push
# carries no inputs, so it could only publish the defaults.
#
# The whole distribution is REBUILT here (build.yml runs again) rather than promoting an
# old CI run's artifacts: what we publish is then exactly the bytes that were just
# verified, in this run, and the release does not depend on some past run still existing.
# The rules of publishing itself (never overwrite a published file, rclone, the index,
# the CDN) live where they are enforced: publish-conda.yml, its header and its steps.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Isabelle release to publish, e.g. Isabelle2026 (must be registered in releases/)"
        type: string
        required: true
      build_number:
        description: "conda build number - BUMP THIS if you republish the same Isabelle release with changed content"
        type: string
        required: true

# One isabelle release at a time: a second dispatch waits, and then publish-conda's
# guard refuses to overwrite the first one's files.
concurrency:
  group: release-isabelle
  cancel-in-progress: false

jobs:
  # Rebuild + verify everything: build.yml's install-* jobs already prove the packages
  # install and run, from a local channel.  What a release publishes can never be
  # withdrawn, so here a GUI check that gets no verdict from Claude fails.
  build:
    uses: ./.github/workflows/build.yml
    with:
      release: ${{ inputs.release }}
      build_number: ${{ inputs.build_number }}
      require_gui_verdict: true
    # the GUI checks need CLAUDE_CODE_OAUTH_TOKEN; a reusable workflow
    # receives NO secrets unless the caller passes them.
    secrets: inherit

  # The R2 publish path is shared with every component package (isabelle-performant-ml,
  # isabelle-rpc, ...), each of which releases from its own repo.  Keeping it in one
  # reusable workflow is what stops the credentials and the channel-indexing rules from
  # being copied into seven repos and drifting apart.
  publish:
    name: "Publish to conda.qiyuan.me (R2)"
    needs: build
    uses: ./.github/workflows/publish-conda.yml
    with:
      artifact: conda-packages
      package_name: isabelle
    # Passed explicitly, not `inherit`: naming them re-arms the `required: true`
    # declarations in publish-conda.yml, so a repo missing a secret fails at
    # workflow-resolution time instead of dying later on an opaque S3 auth error.
    secrets:
      CONDA_R2_ACCESS_KEY_ID:     ${{ secrets.CONDA_R2_ACCESS_KEY_ID }}
      CONDA_R2_SECRET_ACCESS_KEY: ${{ secrets.CONDA_R2_SECRET_ACCESS_KEY }}

  # ---------------------------------------------------------------------------
  # The user's command, on a clean machine, on every platform.
  #
  # This is NOT a repeat of build.yml's install checks.  Those install from a LOCAL channel
  # (file://) and prove the PACKAGES work.  This installs from the real URL and
  # proves the CHANNEL works -- that the bytes reached R2, that conda-index wrote
  # a repodata that names them correctly, and that conda's solver can act on it.
  # Those two can fail independently: a package can be perfect while the upload
  # drops a file or repodata points at a filename that isn't there.  build.yml would
  # still be green and the user still could not install.
  #
  # Running it immediately after publishing is safe, and that is measured, not
  # assumed: repodata.json comes back `cf-cache-status: DYNAMIC` (Cloudflare does
  # not cache .json by default) and we index with --no-zst, so the .zst that IS
  # cached for 4h never exists.  There is no propagation window to wait out.
  # ---------------------------------------------------------------------------
  smoke:
    name: "Smoke: conda install from conda-ci.qiyuan.me (${{ matrix.runner }})"
    needs: [build, publish]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.build.outputs.version }}
      RELEASE: ${{ inputs.release }}
      BUILD_NUMBER: ${{ inputs.build_number }}
    strategy:
      fail-fast: false          # one platform's failure must not hide the others
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]      # no macOS: its runners are too slow
    defaults:
      run:
        # bash -l (LOGIN shell), not plain bash: setup-miniconda only puts `conda` on
        # PATH via the profile a login shell sources.  The first Windows smoke ran under
        # Git-Bash `bash --noprofile --norc` and died with `conda: command not found`
        # before the install even started -- the package was never the problem.  `-l`
        # is the documented setup-miniconda shell and is correct on every OS.
        shell: bash -l {0}
    steps:
      - name: Checkout CI repo (for releases/)
        uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-activate-base: true
          activate-environment: ""

      - name: "conda install -c https://conda-ci.qiyuan.me -c conda-forge isabelle"
        run: |
          set -euo pipefail
          # Pin the build just published, by the version build.yml reports: unpinned,
          # conda could quietly pick another build on the channel and test that instead.
          [ -n "$VERSION" ] || { echo "::error::build reported no conda version"; exit 1; }
          # Capture the install output: conda prints the package's post-link message
          # (its .messages.txt) here, and we assert it appeared -- so this smoke also
          # verifies the post-install hint on every platform, including the Windows .bat.
          conda create -y -p "$RUNNER_TEMP/isa" -c https://conda-ci.qiyuan.me -c conda-forge \
            --override-channels "isabelle=$VERSION=$BUILD_NUMBER" 2>&1 | tee "$RUNNER_TEMP/create.log"
          grep -q "Isabelle is installed" "$RUNNER_TEMP/create.log" \
            || { echo "::error::post-install hint (.messages.txt) did not print"; exit 1; }
          conda list -p "$RUNNER_TEMP/isa" isabelle
          id=$(tr -d '\r\n' < "$RUNNER_TEMP/isa/isa/etc/ISABELLE_ID")
          want=$(tr -d '\r\n' < "releases/$RELEASE/ISABELLE_ID")
          echo "etc/ISABELLE_ID = $id (official: $want)"
          [ "$id" = "$want" ] || { echo "::error::installed ISABELLE_ID $id is not the official $want"; exit 1; }

      - name: "...and it runs"
        run: |
          set -euo pipefail
          # Windows puts the entry point in Scripts/, everyone else in bin/.
          if [ -x "$RUNNER_TEMP/isa/bin/isabelle" ]; then
            BIN="$RUNNER_TEMP/isa/bin/isabelle"
          else
            BIN="$RUNNER_TEMP/isa/Scripts/isabelle.bat"
          fi
          echo "entry point: $BIN"
          # The first call.  On Windows, isabelle.bat initializes Cygwin first and fails if
          # that fails (build.yml, install-windows); a classpath shows that Isabelle's Java
          # setup runs.
          cp=$("$BIN" getenv -b ISABELLE_SETUP_CLASSPATH | tr -d '\r') || {
            echo "::error::the first isabelle call failed (its error is above)"; exit 1; }
          [ -n "$cp" ] || { echo "::error::isabelle.setup.Setup printed no classpath"; exit 1; }
          echo "first isabelle call: ISABELLE_SETUP_CLASSPATH has ${#cp} characters"
          v=$("$BIN" version)
          echo "isabelle version -> $v"
          [ -n "$v" ] || { echo "::error::isabelle version printed nothing"; exit 1; }
