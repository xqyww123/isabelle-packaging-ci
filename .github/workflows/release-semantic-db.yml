# Publish the `isabelle-semantic-data` data package to https://conda.qiyuan.me.
#
# The release chain (SEMANTIC_DB_LAYERED_PLAN.md, L7/L18): Hugging Face holds the
# dev-synced working database (uploaded by `manage_data.py update`); this workflow
# turns it into the published artifact.  Everything content-shaping runs HERE, on
# the runner, never on a dev machine:
#
#   download the HF tarball -> `isabelle-semantics export` (drop tombstones, build
#   the system experience index, stamp the manifest, compacting rewrite, gates)
#   -> rattler-build the hook-less data package -> publish.
#
# The package version is YYYY.MM.DD.HHMM (UTC), derived from the created_at the
# export just stamped (L15) -- there is no version input: the manifest is the
# single clock.  Dispatch it with `isabelle-semantics release` (which runs a soft
# HF-freshness check first and asks dry-run-or-real) or manually:
#     gh workflow run release-semantic-db --repo xqyww123/isabelle-packaging-ci -f dry_run=false
# NOTE dry_run DEFAULTS TO TRUE: a bare dispatch builds and validates but
# publishes nothing.
#
# Secrets: HF_TOKEN (read access to the ANTPG/MLML-data dataset) and the shared
# CONDA_R2_* channel credentials.
name: release-semantic-db

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "conda build number - BUMP only to re-release the same snapshot with fixed packaging"
        type: string
        default: "0"
      dry_run:
        description: "Build and test only -- do NOT publish to the channel"
        type: boolean
        default: true

concurrency:
  group: release-semantic-db
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.12"

      - name: Install the exporting library (isabelle-semantic-embedding)
        shell: bash -l {0}
        run: |
          set -euo pipefail
          # The RELEASED library, from the channel it will be consumed with --
          # the export must run on the same code users read the payload with.
          # Same floor as the data package's own run dependency: dispatching
          # before a compatible library is published must fail HERE, loudly.
          conda install -y -c https://conda.qiyuan.me -c conda-forge \
            "isabelle-semantic-embedding>=0.3.0"
          python -m pip install --quiet "huggingface_hub"
          isabelle-semantics --help >/dev/null

      - name: Download the HF dev-sync snapshot
        shell: bash -l {0}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download
          path = hf_hub_download(
              repo_id="ANTPG/MLML-data", repo_type="dataset",
              filename="contrib/Semantic_Embedding/Isabelle_Semantic_Embedding.tar.zst",
              token=os.environ["HF_TOKEN"])
          print(path)
          open(os.path.join(os.environ["RUNNER_TEMP"], "tarball_path"), "w").write(path)
          PY

      - name: Extract and export (tombstones dropped, gates run)
        id: export
        shell: bash -l {0}
        run: |
          set -euo pipefail
          tarball=$(cat "$RUNNER_TEMP/tarball_path")
          mkdir -p "$RUNNER_TEMP/db"
          tar --zstd -xf "$tarball" -C "$RUNNER_TEMP/db"
          # The tarball holds the whole cache directory under its own name.
          db_dir=$(find "$RUNNER_TEMP/db" -maxdepth 1 -mindepth 1 -type d | head -1)
          [ -d "$db_dir/semantics.lmdb" ] \
            || { echo "::error::no semantics.lmdb in the HF snapshot"; exit 1; }

          export SEMANTIC_DB_DIR="$db_dir"
          isabelle-semantics export "$RUNNER_TEMP/payload"

          version=$(python - <<'PY'
          import json, os
          m = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "payload", "MANIFEST.json")))
          from Isabelle_Semantic_Embedding.snapshot_sync import version_of_created_at
          print(version_of_created_at(m["created_at"]))
          PY
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "exported version $version"

      - name: Install rattler-build
        run: |
          set -euo pipefail
          curl -fsSL -o rattler-build \
            https://github.com/prefix-dev/rattler-build/releases/download/v0.69.1/rattler-build-x86_64-unknown-linux-musl
          chmod +x rattler-build
          ./rattler-build --version

      - name: Build the data package
        env:
          SEMANTIC_DATA_VERSION: ${{ steps.export.outputs.version }}
          SEMANTIC_DATA_PAYLOAD: ${{ runner.temp }}/payload
        run: |
          set -euo pipefail
          # Our channel FIRST: the run dependency (isabelle-semantic-embedding)
          # exists nowhere else, and rattler-build resolves the test
          # environment as well as the build one.
          ./rattler-build build \
            --recipe conda/data/isabelle-semantic-data/recipe.yaml \
            --output-dir out \
            --build-num "${{ inputs.build_number }}" \
            -c https://conda.qiyuan.me -c conda-forge
          find out -name '*.conda' -print

      - name: "Sanity: hook-less, dependency-less, payload in place"
        run: |
          set -euo pipefail
          pkg=$(find out -name 'isabelle-semantic-data-*.conda' | head -1)
          [ -n "$pkg" ] || { echo "::error::no package produced"; exit 1; }
          python3 -m pip install --quiet zstandard
          work=$(mktemp -d)
          python3 - "$pkg" "$work" <<'PY'
          import io, sys, tarfile, zipfile, zstandard
          z = zipfile.ZipFile(sys.argv[1])
          for member in z.namelist():
              if member.startswith(("pkg-", "info-")) and member.endswith(".tar.zst"):
                  r = zstandard.ZstdDecompressor().stream_reader(io.BytesIO(z.read(member)))
                  tarfile.open(fileobj=io.BytesIO(r.read())).extractall(sys.argv[2])
          PY
          test -f "$work/share/isabelle-semantic-data/MANIFEST.json" \
            || { echo "::error::no MANIFEST.json in the payload"; exit 1; }
          test -f "$work/share/isabelle-semantic-data/semantics.lmdb/data.mdb" \
            || { echo "::error::no semantics.lmdb in the payload"; exit 1; }
          # Hook-less by design (plan L2): a link hook here is a packaging bug.
          if find "$work" -name '.*-post-link*' -o -name '.*-pre-unlink*' | grep -q .; then
            echo "::error::the data package must not carry link hooks"; exit 1
          fi
          python3 - "$work" <<'PY'
          import json, pathlib, re, sys
          idx = json.loads((pathlib.Path(sys.argv[1]) / "info" / "index.json").read_text())
          deps = idx.get("depends", [])
          print("depends =", deps)
          # Exactly ONE dependency: the reader-library floor (user decision
          # 2026-07-26) -- a pre-layered library ignores the payload silently.
          names = sorted(re.split(r"[ <>=!]", d, 1)[0] for d in deps)
          if names != ["isabelle-semantic-embedding"]:
              raise SystemExit(f"::error::expected exactly the isabelle-semantic-embedding floor, got {deps}")
          if idx.get("subdir") != "noarch":
              raise SystemExit(f"::error::expected noarch, got {idx.get('subdir')}")
          print("  OK  noarch, hook-less, exactly the reader-library floor, payload present")
          PY

      - name: Lay the package out as <subdir>/*.conda for publish-conda.yml
        run: |
          set -euo pipefail
          mkdir -p pkgs/noarch
          find out -name '*.conda' -exec cp {} pkgs/noarch/ \;
          n=$(find pkgs -name '*.conda' | wc -l)
          [ "$n" -eq 1 ] || { echo "::error::expected exactly 1 package, found $n"; exit 1; }
          ls -l pkgs/noarch/

      - uses: actions/upload-artifact@v4
        with:
          name: conda-packages
          path: pkgs/**/*.conda
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/publish-conda.yml
    with:
      artifact: conda-packages
      package_name: isabelle-semantic-data
    secrets:
      CONDA_R2_ACCESS_KEY_ID:     ${{ secrets.CONDA_R2_ACCESS_KEY_ID }}
      CONDA_R2_SECRET_ACCESS_KEY: ${{ secrets.CONDA_R2_SECRET_ACCESS_KEY }}

  smoke:
    name: "Smoke: conda install from conda.qiyuan.me"
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.12"

      - name: "conda install -c https://conda.qiyuan.me isabelle-semantic-data"
        shell: bash -l {0}
        run: |
          set -euo pipefail
          conda install -y -c https://conda.qiyuan.me -c conda-forge \
            isabelle-semantic-data isabelle-semantic-embedding
          test -f "$CONDA_PREFIX/share/isabelle-semantic-data/MANIFEST.json"
          # The read facade must discover it as the conda-delivered system DB.
          python -c "from Isabelle_Semantic_Embedding.snapshot_sync import validated_system_db; s = validated_system_db(); assert s is not None and s.source == 'conda', s; print('system DB discovered:', s.path)"
