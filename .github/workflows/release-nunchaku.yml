# Publish the `isabelle-nunchaku` component package to https://conda.qiyuan.me.
#
# The release chain (NUNCHAKU_FORK_PLAN.md in the MLML workspace): the fork
# xqyww123/nunchaku is tagged v<version> (VERSION file = single source); its CI
# builds the musl-static binary, smokes it against the exact Isabelle frontend
# flag table, and attaches it to the GitHub release as
# `nunchaku-bin-x86_64-linux`.  This workflow stages that asset next to the
# recipe, rattler-builds the component package (recipe:
# conda/components/isabelle-nunchaku/recipe.yaml -- it pulls the fork at the
# tag and the sha256-pinned static cvc5 itself), sanity-checks the layout, and
# publishes through the shared publish path.  linux-64 only, by design.
#
# Dispatch:
#     gh workflow run release-nunchaku --repo xqyww123/isabelle-packaging-ci \
#       -f version=0.5.1 -f dry_run=false
# NOTE dry_run DEFAULTS TO TRUE: a bare dispatch builds and validates but
# publishes nothing.
#
# Secrets: the shared CONDA_R2_* channel credentials.
name: release-nunchaku

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version -- must equal the fork's VERSION at tag v<version>"
        type: string
        required: true
      build_number:
        description: "conda build number - BUMP only to re-release the same version with fixed packaging"
        type: string
        default: "0"
      dry_run:
        description: "Build and test only -- do NOT publish to the channel"
        type: boolean
        default: true

concurrency:
  group: release-nunchaku
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Stage the CI-built static binary from the fork release
        run: |
          set -euo pipefail
          base="https://github.com/xqyww123/nunchaku/releases/download/v${{ inputs.version }}"
          dst=conda/components/isabelle-nunchaku/nunchaku-bin
          curl -fsSL -o "$dst" "$base/nunchaku-bin-x86_64-linux"
          # release assets are mutable (same-name re-upload); pin by digest
          curl -fsSL -o nunchaku-bin.sha256 "$base/nunchaku-bin-x86_64-linux.sha256"
          echo "$(cut -d' ' -f1 nunchaku-bin.sha256)  $dst" | sha256sum -c
          chmod +x "$dst"
          # really static (INTERP is an ELF program-header name, locale-free),
          # self-reports the release version, and answers --help
          ! readelf -l "$dst" | grep -q INTERP
          "$dst" --version | grep -q " ${{ inputs.version }} "
          "$dst" --help > /dev/null

      - name: Install rattler-build
        run: |
          set -euo pipefail
          curl -fsSL -o rattler-build \
            https://github.com/prefix-dev/rattler-build/releases/download/v0.69.1/rattler-build-x86_64-unknown-linux-musl
          chmod +x rattler-build
          ./rattler-build --version

      - name: Build the component package
        env:
          ISA_COMPONENT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ./rattler-build build \
            --recipe conda/components/isabelle-nunchaku/recipe.yaml \
            --output-dir out \
            --build-num "${{ inputs.build_number }}" \
            -c https://conda.qiyuan.me -c conda-forge
          find out -name '*.conda' -print

      - name: "Sanity: layout, hooks, version injection, dependency bound"
        run: |
          set -euo pipefail
          pkg=$(find out -name 'isabelle-nunchaku-*.conda' | head -1)
          [ -n "$pkg" ] || { echo "::error::no package produced"; exit 1; }
          python3 -m pip install --quiet zstandard
          work=$(mktemp -d)
          python3 - "$pkg" "$work" <<'PY'
          import io, sys, tarfile, zipfile, zstandard
          z = zipfile.ZipFile(sys.argv[1])
          for member in z.namelist():
              if member.startswith(("pkg-", "info-")) and member.endswith(".tar.zst"):
                  r = zstandard.ZstdDecompressor().stream_reader(io.BytesIO(z.read(member)))
                  tarfile.open(fileobj=io.BytesIO(r.read())).extractall(sys.argv[2])
          PY
          comp="$work/share/isabelle-nunchaku"
          grep -q "NUNCHAKU_VERSION=\"${{ inputs.version }}\"" "$comp/etc/settings" \
            || { echo "::error::etc/settings does not carry NUNCHAKU_VERSION=${{ inputs.version }}"; exit 1; }
          grep -Eq '^base [0-9a-f]{40}$' "$comp/COMMIT" \
            || { echo "::error::COMMIT lacks the upstream base line"; exit 1; }
          grep -Eq '^build [0-9a-f]{40}$' "$comp/COMMIT" \
            || { echo "::error::COMMIT lacks the build line"; exit 1; }
          # the packaged tree must be the live tag's commit
          tag_sha=$(git ls-remote https://github.com/xqyww123/nunchaku.git \
                      "refs/tags/v${{ inputs.version }}^{}" | cut -f1)
          [ -n "$tag_sha" ] || { echo "::error::tag v${{ inputs.version }} not found upstream"; exit 1; }
          grep -q "^build $tag_sha\$" "$comp/COMMIT" \
            || { echo "::error::COMMIT build sha does not match tag v${{ inputs.version }} ($tag_sha)"; exit 1; }
          test -x "$comp/x86_64-linux/nunchaku"
          test -x "$comp/x86_64-linux/nunchaku-bin"
          test -x "$comp/x86_64-linux/solvers/cvc5"
          test -f "$comp/LICENSE" && test -f "$comp/LICENSE-cvc5"
          # exactly the two unix hooks -- this is a linux-64 package, a .bat
          # would be dead weight and any other hook is a packaging bug
          hooks=$(cd "$work" && find . \( -name '.*-post-link*' -o -name '.*-pre-unlink*' \) \
                    | sed 's|^\./||' | LC_ALL=C sort)
          expected=$(printf '%s\n' 'bin/.isabelle-nunchaku-post-link.sh' \
                                   'bin/.isabelle-nunchaku-pre-unlink.sh' | LC_ALL=C sort)
          if [ "$hooks" != "$expected" ]; then
            echo "::error::unexpected link hooks"; printf 'got:\n%s\nexpected:\n%s\n' "$hooks" "$expected"; exit 1
          fi
          python3 - "$work" <<'PY'
          import json, pathlib, re, sys
          idx = json.loads((pathlib.Path(sys.argv[1]) / "info" / "index.json").read_text())
          deps = idx.get("depends", [])
          print("depends =", deps)
          names = sorted(re.split(r"[ <>=!]", d, 1)[0] for d in deps)
          if names != ["isabelle"]:
              raise SystemExit(f"::error::expected exactly the isabelle series bound, got {deps}")
          if idx.get("subdir") != "linux-64":
              raise SystemExit(f"::error::expected linux-64, got {idx.get('subdir')}")
          print("  OK  linux-64, unix hooks only, isabelle series bound")
          PY

      - name: Lay the package out as <subdir>/*.conda for publish-conda.yml
        run: |
          set -euo pipefail
          mkdir -p pkgs/linux-64
          find out -name '*.conda' -exec cp {} pkgs/linux-64/ \;
          n=$(find pkgs -name '*.conda' | wc -l)
          [ "$n" -eq 1 ] || { echo "::error::expected exactly 1 package, found $n"; exit 1; }
          ls -l pkgs/linux-64/

      - uses: actions/upload-artifact@v4
        with:
          name: conda-packages
          path: pkgs/**/*.conda
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/publish-conda.yml
    with:
      artifact: conda-packages
      package_name: isabelle-nunchaku
    secrets:
      CONDA_R2_ACCESS_KEY_ID:     ${{ secrets.CONDA_R2_ACCESS_KEY_ID }}
      CONDA_R2_SECRET_ACCESS_KEY: ${{ secrets.CONDA_R2_SECRET_ACCESS_KEY }}

  smoke:
    name: "Smoke: conda install from conda.qiyuan.me"
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.12"

      - name: Install and verify the component end-to-end
        shell: bash -l {0}
        run: |
          set -euo pipefail
          conda create -y -n smoke -c https://conda.qiyuan.me -c conda-forge \
            "isabelle-nunchaku=${{ inputs.version }}"
          conda activate smoke
          comp="$CONDA_PREFIX/share/isabelle-nunchaku"
          # the post-link hook registered the component with the base isabelle
          "$CONDA_PREFIX/isa/bin/isabelle" getenv -b NUNCHAKU_VERSION | grep -qx "${{ inputs.version }}"
          "$CONDA_PREFIX/isa/bin/isabelle" getenv -b NUNCHAKU_HOME | grep -qx "$comp/x86_64-linux"
          # the wrapper runs, and its cvc5 satisfies the version floor
          "$comp/x86_64-linux/nunchaku" --help > /dev/null
          "$comp/x86_64-linux/solvers/cvc5" --version | head -1 | grep -q 'cvc5 1.3.4'
          # the uninstall half of the design: removing the package must
          # close the version gate (NUNCHAKU_VERSION falls back to the
          # distribution's "0.5"), non-vacuously
          conda remove -y isabelle-nunchaku
          v_after=$("$CONDA_PREFIX/isa/bin/isabelle" getenv -b NUNCHAKU_VERSION || true)
          [ "$v_after" != "${{ inputs.version }}" ] \
            || { echo "::error::NUNCHAKU_VERSION still ${{ inputs.version }} after conda remove"; exit 1; }
          echo "after remove: NUNCHAKU_VERSION='$v_after'"
          echo "smoke OK"
