name: build

# Reusable workflow: packages the OFFICIAL Isabelle release, its sources unmodified.
#
# tests             — ubuntu-latest: the unit tests (tests/), which `conda` waits for.
# bundles           — ubuntu-latest: download the official platform bundles and check them
#                     against releases/<release>/SHA256SUMS, the checksums the Isabelle
#                     site publishes, registered here once per release.  Upstream is
#                     downloaded from once per run, so `conda` can be re-run without it.
# conda             — ubuntu-latest: turn each bundle, its own Pure/HOL heaps included, into
#                     a conda package (one per conda subdir), checking that the package is
#                     the official tree plus the packaging changes (scripts/check_pristine.py).
#                     It VERIFIES by installing from a local channel; it does NOT publish.
#                     Publishing to R2 lives in release.yml, so that a push can never move
#                     the channel (PACKAGING_DESIGN.md §5.4).
# install-linux-arm, install-windows
#                   — install and run the packages on the platforms they are for.

on:
  workflow_call:
    inputs:
      release:
        description: "Isabelle release, e.g. Isabelle2026 (must be registered in releases/)"
        type: string
        required: true
      build_number:
        description: "conda build number -- becomes the package's build string (isabelle-<version>-<N>)"
        type: string
        required: true
      require_gui_verdict:
        description: "fail a GUI check that Claude does not judge (release.yml sets it)"
        type: boolean
        default: false
    outputs:
      version:
        description: "the conda version of the packages, e.g. 2026"
        value: ${{ jobs.conda.outputs.version }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: >-
          Claude subscription token (`claude setup-token`) for the GUI checks.
          Without it the screenshot is still taken and uploaded, and only the AI
          judgement is skipped (a failure under require_gui_verdict).  A reusable
          workflow gets NO secrets unless they are declared here AND passed by the
          caller (`secrets: inherit`).  NB deliberately not ANTHROPIC_API_KEY -- that
          outranks the OAuth token in Claude Code's auth chain and would bill the
          metered API instead of the subscription.
        required: false

env:
  # The release gate, for every GUI check (scripts/gui_judge.sh, unjudged).
  REQUIRE_GUI_VERDICT: ${{ inputs.require_gui_verdict }}

jobs:
  tests:
    name: "tests - unit tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4

      - name: pytest
        run: pipx run --spec pytest==8.4.2 pytest -q -p no:cacheprovider tests/

  bundles:
    name: "bundles - the official platform bundles (download + SHA256)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE: ${{ inputs.release }}
      DL: ${{ github.workspace }}/dl
    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4
        with:
          path: ci

      - name: Download the official platform bundles
        run: |
          set -euo pipefail
          SUMS="ci/releases/$RELEASE/SHA256SUMS"
          [ -f "$SUMS" ] || { echo "::error::$RELEASE is not registered: no releases/$RELEASE/ (RELEASE_ISABELLE.md, \"Register the release\")"; exit 1; }
          mkdir -p "$DL"
          while read -r _ f; do
            echo "=== $f ==="
            curl -fsS --retry 5 --retry-delay 20 -o "$DL/$f" "https://isabelle.in.tum.de/website-$RELEASE/dist/$f"
            ls -l "$DL/$f"
          done < "$SUMS"
          cd "$DL" && sha256sum -c "$GITHUB_WORKSPACE/$SUMS"

      - name: Upload the bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.release }}-bundles
          path: ${{ github.workspace }}/dl/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # ===========================================================================
  # conda: packaging.
  #
  # Everything happens on Linux, for every target platform -- including win-64.
  # Nothing is compiled here; we unpack and zip the result into a .conda
  # (PACKAGING_DESIGN.md §5.0).
  #
  # This job PUBLISHES NOTHING.  It verifies the packages against a local channel and
  # uploads them as an artifact; release.yml is what pushes them to R2.
  # ===========================================================================
  conda:
    name: "conda - conda packages (all subdirs)"
    needs: [bundles, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      RELEASE: ${{ inputs.release }}
      CH: ${{ github.workspace }}/channel      # local channel, for verification only
      OUT: ${{ github.workspace }}/out
      # pack.sh requires both; the build number becomes the conda build string.
      # (release.yml passes its build_number input here.)
      ISA_RELEASE: ${{ inputs.release }}
      ISA_BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4

      - name: The conda version
        id: version
        run: echo "version=$(scripts/pack.sh --conda-version)" >> "$GITHUB_OUTPUT"

      - name: Disk assertion (+ cleanup only if needed)
        run: |
          set -euo pipefail
          df -h /
          avail=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "free on / = ${avail} GB"
          # Peak here: 5 bundles (~7 GB) + one unpacked tree (~3 GB)
          # + one $PREFIX copy (~3 GB) + 5 finished .conda (~6 GB).  We unpack and
          # package ONE platform at a time and delete the staging in between.
          if [ "$avail" -lt 60 ]; then
            echo "::warning::free disk below threshold - running cleanup"
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                        /usr/local/.ghcup /usr/local/share/powershell \
                        /usr/share/swift /usr/local/share/chromium \
                        /opt/hostedtoolcache/CodeQL || true
            df -h /
          fi

      - name: Install 7-Zip + rattler-build
        run: |
          set -euo pipefail
          # 7-Zip: to unpack the Windows SFX .exe.
          # !! The binary is `7z` on Debian/Ubuntu, NOT `7zz`.  `7zz` is upstream 7-Zip's
          # !! (and conda-forge's) name; Ubuntu's `7zip` package installs /usr/bin/7z.
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends 7zip

          # A REAL assertion.  The previous version of this line was
          #     7zz i > /dev/null && echo "7zz: ..."
          # which is a FAKE guard: under `set -e`, a command that is not the last in an
          # && list is exempt from errexit, so `7zz: command not found` was swallowed and
          # this step went GREEN with no 7-Zip at all.  The build then died 25 minutes
          # later inside pack.sh, on the fifth and last package.  Guards must be written
          # so that they can actually fail.
          command -v 7zz >/dev/null || command -v 7z >/dev/null || {
            echo "::error::no 7-Zip binary found (tried 7zz and 7z)"; exit 1; }
          echo "7-Zip: $(command -v 7zz || command -v 7z)"

          # rattler-build: a single static binary.  conda-build is in maintenance mode
          # and takes minutes where this takes seconds (PACKAGING_DESIGN.md §3.3).
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/rb.tar.gz \
            https://github.com/prefix-dev/rattler-build/releases/latest/download/rattler-build-x86_64-unknown-linux-musl.tar.gz
          tar xzf /tmp/rb.tar.gz -C /tmp
          mv /tmp/rattler-build-x86_64-unknown-linux-musl/rattler-build "$HOME/.local/bin/"
          chmod +x "$HOME/.local/bin/rattler-build"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/rattler-build" --version

      - name: Download the bundles
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.release }}-bundles
          path: ${{ runner.temp }}/bundles

      - name: "Build the conda packages"
        run: |
          set -euo pipefail
          export WORK="$RUNNER_TEMP/pack"
          # check_pristine.py reads the .conda's zstd members: the runner's Miniconda has
          # the zstandard module, its system python3 does not.
          export PYTHON="$CONDA/bin/python"

          # conda subdir | official bundle (releases/<release>/SHA256SUMS lists them)
          for spec in \
            "linux-64      ${RELEASE}_linux.tar.gz" \
            "linux-aarch64 ${RELEASE}_linux_arm.tar.gz" \
            "osx-64        ${RELEASE}_macos.tar.gz" \
            "osx-arm64     ${RELEASE}_macos_arm.tar.gz" \
            "win-64        ${RELEASE}.exe"
          do
            set -- $spec
            echo "::group::$1"
            scripts/pack.sh --subdir "$1" --bundle "$RUNNER_TEMP/bundles/$2" --out "$OUT"
            # reclaim the unpacked tree + the build prefix before the next platform
            rm -rf "$WORK/stage" "$OUT/bld"
            df -h / | tail -1
            echo "::endgroup::"
          done

      # -------------------------------------------------------------------------
      # Verify against a LOCAL channel: deterministic, no CDN in the way
      # (PACKAGING_DESIGN.md §5.4).  conda-forge is named too, for python (recipe.yaml
      # says why).  Only linux-64 can actually be RUN here -- the other four are
      # cross-targets and this runner cannot execute them.
      # -------------------------------------------------------------------------
      - name: "Index a local channel and install linux-64 from it"
        run: |
          set -euo pipefail
          # The runner's preinstalled Miniconda is ROOT-owned; without this, both the
          # `conda install` below and the package cache that `conda create` writes to
          # ($CONDA/pkgs) fail with EACCES.
          sudo chown -R "$(id -u):$(id -g)" "$CONDA"
          $CONDA/bin/conda install -y -n base -c conda-forge conda-index -q

          mkdir -p "$CH/noarch"
          for f in "$OUT"/*/isabelle-*.conda; do
            s=$(basename "$(dirname "$f")"); mkdir -p "$CH/$s"; cp "$f" "$CH/$s/"
          done
          # --no-zst: Cloudflare caches repodata.json.zst for 4h but never the plain
          # .json, and conda prefers the .zst -> a fresh publish would be invisible for
          # hours.  (PACKAGING_DESIGN.md §3.3)
          $CONDA/bin/python -m conda_index "$CH" --no-zst --no-bz2 --channeldata \
            --channel-name conda.qiyuan.me

          echo "===== what the channel advertises ====="
          # Informational only -- must not be able to fail the step.  Uses .get() and a
          # trailing `|| true`: a diagnostic print of channel contents must never red a
          # job whose packages are already built and indexed correctly.
          $CONDA/bin/python - <<'PY' || true
          import json, pathlib, os
          ch = pathlib.Path(os.environ["CH"])
          for sub in sorted(p.name for p in ch.iterdir() if p.is_dir()):
              rd = ch / sub / "repodata.json"
              if not rd.exists(): continue
              for fn, m in json.load(rd.open()).get("packages.conda", {}).items():
                  print(f"  {sub:14s} {m['name']}-{m['version']}-{m['build']}  depends={m.get('depends')}")
          PY

          echo "===== conda create from the local channel ====="
          $CONDA/bin/conda create -y -p "$RUNNER_TEMP/isaenv" \
            -c "file://$CH" -c conda-forge --override-channels isabelle

      - name: "linux-64: install and RUN"
        run: |
          set -euo pipefail
          $CONDA/bin/conda list -p "$RUNNER_TEMP/isaenv" isabelle
          scripts/verify_install.sh "$RUNNER_TEMP/isaenv"

      - name: "Two environments of the same name get their own user directory"
        run: |
          set -euo pipefail
          # scripts/pack.sh 1c: the suffix carries a hash of the whole prefix path.
          for d in a b; do
            $CONDA/bin/conda create -y -q -p "$RUNNER_TEMP/$d/env" \
              -c "file://$CH" -c conda-forge --override-channels isabelle > /dev/null
          done
          ua=$("$RUNNER_TEMP/a/env/bin/isabelle" getenv -b ISABELLE_HOME_USER)
          ub=$("$RUNNER_TEMP/b/env/bin/isabelle" getenv -b ISABELLE_HOME_USER)
          echo "a/env -> $ua"; echo "b/env -> $ub"
          [ "$ua" != "$ub" ] || { echo "::error::two environments named env share $ua"; exit 1; }
          case "$ua" in
            */.isabelle/"$RELEASE"-conda-env-*) ;;
            *) echo "::error::unexpected user directory $ua"; exit 1 ;;
          esac
          rm -rf "$RUNNER_TEMP/a" "$RUNNER_TEMP/b"

      - name: "The isabelle post-link re-runs its dependents' post-links"
        run: |
          set -euo pipefail
          scripts/check_rerun.sh build "$RUNNER_TEMP/probe-channel"
          mkdir -p "$RUNNER_TEMP/probe-channel/linux-64"
          cp "$CH"/linux-64/isabelle-*.conda "$RUNNER_TEMP/probe-channel/linux-64/"
          $CONDA/bin/python -m conda_index "$RUNNER_TEMP/probe-channel" --no-zst --no-bz2
          scripts/check_rerun.sh run "$CONDA/bin/conda" "file://$RUNNER_TEMP/probe-channel" "$RUNNER_TEMP/probe-env"
          rm -rf "$RUNNER_TEMP/probe-env"

      - name: Upload the post-link probe (for install-windows)
        uses: actions/upload-artifact@v4
        with:
          name: rerun-probe
          path: ${{ runner.temp }}/probe-channel/noarch/isabelle-rerun-probe-*.conda
          if-no-files-found: error
          retention-days: 7

      # -------------------------------------------------------------------------
      # The GUI is the one thing no headless assertion reaches: every check above
      # passes on a package whose jEdit dies on startup.  So: run jEdit under Xvfb on
      # a theory with one lemma that must succeed and one that must fail, screenshot
      # it, and have Claude Code look at the pixels.  The verdict is the DISCRIMINATING
      # pair -- an error marker on exactly the bad line -- because "a window appeared"
      # is satisfied by an empty frame.  See scripts/verify_gui.sh for the reasoning
      # (notably: an 'Isabelle build' dialog means HOL is being rebuilt, and fails it).
      # -------------------------------------------------------------------------
      - name: Install GUI-check deps (Xvfb, xdotool, ImageMagick)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11-utils xdotool imagemagick
          for t in Xvfb xdpyinfo xdotool import jq; do
            command -v "$t" >/dev/null || { echo "::error::missing $t"; exit 1; }
          done

      - name: "GUI verification: start jEdit and have Claude Code judge the screenshot"
        env:
          # OAuth (subscription) token ONLY.  Never add ANTHROPIC_API_KEY here.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: scripts/verify_gui.sh "$RUNNER_TEMP/isaenv" "$RUNNER_TEMP/gui"

      - name: Upload the GUI screenshot + verdict
        if: always()          # on failure this IS the evidence -- upload it either way
        uses: actions/upload-artifact@v4
        with:
          name: gui-verification
          path: |
            ${{ runner.temp }}/gui/jedit.png
            ${{ runner.temp }}/gui/verdict.json
            ${{ runner.temp }}/gui/jedit.log
            ${{ runner.temp }}/gui/claude.err
            ${{ runner.temp }}/gui/xvfb.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload the conda packages
        uses: actions/upload-artifact@v4
        with:
          name: conda-packages
          path: ${{ github.workspace }}/out/*/isabelle-*.conda
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # ===========================================================================
  # install-*: INSTALL AND RUN the packages `conda` built, on the platforms they are
  # actually for.
  #
  # `conda` can only run what it builds on: linux-64.  The other four are cross-built
  # from Linux; these jobs run two of them natively (no macOS job: its runners are too
  # slow; the osx-64 and osx-arm64 packages are built and published unrun):
  #
  #   install-linux-arm  ubuntu-24.04-arm  linux-aarch64  (+ the GUI check)
  #   install-windows    windows-latest    win-64         (+ the post-link re-run, in .bat)
  #
  # All consume `conda`'s `conda-packages` artifact, so what is installed here is the
  # EXACT byte-for-byte package that would be published -- not a rebuild of it.
  #
  # The load-bearing assertion of install-linux-arm is the one in
  # scripts/verify_install.sh: build a real session on top of Main and require that HOL
  # is NOT recompiled.
  # ===========================================================================

  install-linux-arm:
    name: "install-linux-arm - install + run + GUI (linux-aarch64)"
    needs: conda
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4

      - name: Download the conda packages
        uses: actions/download-artifact@v4
        with:
          name: conda-packages
          path: ${{ runner.temp }}/pkgs

      - name: Build a local channel with just the linux-aarch64 package
        run: |
          set -euo pipefail
          CH="$RUNNER_TEMP/channel"
          mkdir -p "$CH/noarch" "$CH/linux-aarch64"
          [ -d "$RUNNER_TEMP/pkgs/linux-aarch64" ] || { echo "::error::conda produced no linux-aarch64 package"; exit 1; }
          cp "$RUNNER_TEMP/pkgs/linux-aarch64"/isabelle-*.conda "$CH/linux-aarch64/"
          rm -rf "$RUNNER_TEMP/pkgs"
          ls -lh "$CH/linux-aarch64"
          echo "CH=$CH" >> "$GITHUB_ENV"

          curl -fsSL -o "$RUNNER_TEMP/mf.sh" \
            https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-aarch64.sh
          bash "$RUNNER_TEMP/mf.sh" -b -p "$HOME/mf"
          "$HOME/mf/bin/conda" install -y -q -c conda-forge conda-index
          "$HOME/mf/bin/python" -m conda_index "$CH" --no-zst --no-bz2 --channeldata \
            --channel-name conda.qiyuan.me

      - name: "linux-aarch64: install and RUN"
        run: |
          set -euo pipefail
          ENV="$RUNNER_TEMP/isaenv"
          "$HOME/mf/bin/conda" create -y -p "$ENV" -c "file://$CH" -c conda-forge --override-channels isabelle
          scripts/verify_install.sh "$ENV"
          echo "ENV=$ENV" >> "$GITHUB_ENV"

      - name: Install GUI-check deps (Xvfb, xdotool, ImageMagick)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11-utils xdotool imagemagick
          for t in Xvfb xdpyinfo xdotool import jq; do
            command -v "$t" >/dev/null || { echo "::error::missing $t"; exit 1; }
          done

      # The same GUI check as `conda`'s, on ARM.  jEdit is a JVM app and the bundle carries
      # an arm64 JDK, so this should just work -- but "should" is exactly the word that has
      # been wrong every time in this pipeline, so we run it.
      - name: "GUI verification on ARM: jEdit under Xvfb, judged by Claude Code"
        env:
          # OAuth (subscription) token ONLY.  Never add ANTHROPIC_API_KEY here.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: scripts/verify_gui.sh "$ENV" "$RUNNER_TEMP/gui"

      - name: Upload the ARM GUI screenshot + verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-verification-arm
          path: |
            ${{ runner.temp }}/gui/jedit.png
            ${{ runner.temp }}/gui/verdict.json
            ${{ runner.temp }}/gui/jedit.log
            ${{ runner.temp }}/gui/claude.err
            ${{ runner.temp }}/gui/xvfb.log
          if-no-files-found: warn
          retention-days: 7

  install-windows:
    name: "install-windows - install + run + post-link re-run (win-64)"
    needs: conda
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -l {0}     # setup-miniconda puts conda on PATH via the login profile
    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4

      - name: Download the conda packages
        uses: actions/download-artifact@v4
        with:
          name: conda-packages
          path: ${{ runner.temp }}/pkgs

      - name: Download the post-link probe
        uses: actions/download-artifact@v4
        with:
          name: rerun-probe
          path: ${{ runner.temp }}/probe

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-activate-base: true
          activate-environment: ""

      - name: Build a local channel with the win-64 package and the probe
        run: |
          set -euo pipefail
          T="$(cygpath -m "$RUNNER_TEMP")"        # D:/a/_temp: a form both bash and conda read
          CH="$T/channel"
          mkdir -p "$CH/noarch" "$CH/win-64"
          [ -d "$T/pkgs/win-64" ] || { echo "::error::conda produced no win-64 package"; exit 1; }
          cp "$T/pkgs/win-64"/isabelle-*.conda "$CH/win-64/"
          cp "$T/probe"/isabelle-rerun-probe-*.conda "$CH/noarch/"
          rm -rf "$T/pkgs"
          conda install -y -q -n base -c conda-forge conda-index
          python -m conda_index "$CH" --no-zst --no-bz2
          echo "T=$T" >> "$GITHUB_ENV"

      # A fresh install, and the user's first `isabelle` call on it.  While Cygwin's
      # `uninitialized` marker is there, isa\bin\isabelle.bat runs Cygwin's
      # initialization (symlinks, rebaseall, postinstall with the permission lists
      # pack.sh step 3 rewrites) before it starts Cygwin's bash, and fails if it fails;
      # postinstall writes etc/passwd, which the package does not ship.  The step ends by
      # making the initialization fail, to show that this check can go red.
      - name: "win-64: install, and the first isabelle call"
        run: |
          set -euo pipefail
          ENV="$T/isaenv"
          CYG="$ENV/isa/contrib/cygwin/isabelle"
          "$CONDA_EXE" create -y -p "$ENV" -c "file:///$T/channel" -c conda-forge --override-channels isabelle
          [ -e "$CYG/uninitialized" ] || { echo "::error::the package does not ship Cygwin's uninitialized marker"; exit 1; }
          [ ! -e "$ENV/isa/contrib/cygwin/etc/passwd" ] || { echo "::error::the package ships Cygwin's etc/passwd"; exit 1; }
          cp=$("$ENV/Scripts/isabelle.bat" getenv -b ISABELLE_SETUP_CLASSPATH | tr -d '\r') || {
            echo "::error::the first isabelle call failed (Cygwin's initialization: its error is above)"; exit 1; }
          [ ! -e "$CYG/uninitialized" ] || { echo "::error::the first isabelle call did not initialize Cygwin"; exit 1; }
          [ -s "$ENV/isa/contrib/cygwin/etc/passwd" ] || { echo "::error::Cygwin's postinstall did not run"; exit 1; }
          [ -n "$cp" ] || { echo "::error::isabelle.setup.Setup printed no classpath"; exit 1; }
          echo "first isabelle call: Cygwin initialized (postinstall wrote etc/passwd), ISABELLE_SETUP_CLASSPATH has ${#cp} characters"
          echo "isabelle version -> $("$ENV/Scripts/isabelle.bat" version | tr -d '\r')"
          # isabelle.bat's jedit detection runs its call/goto labels, which no other step reaches.
          [ "$(ISABELLE_BAT_DRYRUN=1 "$ENV/Scripts/isabelle.bat" jedit | tr -d '\r')" = GUI ] &&
          [ "$(ISABELLE_BAT_DRYRUN=1 "$ENV/Scripts/isabelle.bat" jedit -b | tr -d '\r')" = SYNC ] || {
            echo "::error::isabelle.bat's jedit detection is broken"; exit 1; }
          u=$("$ENV/Scripts/isabelle.bat" getenv -b ISABELLE_HOME_USER | tr -d '\r')
          echo "ISABELLE_HOME_USER = $u"
          # scripts/pack.sh 1c, through Isabelle's own Cygwin (cksum included)
          case "$u" in
            */.isabelle/*-conda-isaenv-[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "::error::unexpected user directory $u"; exit 1 ;;
          esac
          # The negative control: initialize again, with a postinstall that fails.
          : > "$CYG/uninitialized"
          sed -i '1i echo > /isabelle/postinstall.reached; exit 1' "$CYG/postinstall"
          if "$ENV/Scripts/isabelle.bat" version; then
            echo "::error::negative control: a failing postinstall did not fail the isabelle call"; exit 1; fi
          [ -e "$CYG/postinstall.reached" ] || { echo "::error::negative control: the failing postinstall never ran"; exit 1; }
          echo "negative control: with postinstall failing, the first isabelle call failed"

      - name: "win-64: the isabelle post-link re-runs its dependents' post-links (.bat)"
        run: scripts/check_rerun.sh run "$CONDA_EXE" "file:///$T/channel" "$T/probe-env"
