name: thread-cpu-probe

# Measure the per-thread CPU clock shim of Performant_Isabelle_ML
# (library/threadcpu/threadcpu.c) on REAL macOS and Windows machines.  Only its
# Linux branch has ever been compiled or run; the macOS and Windows branches are
# untested guesses, and the file's own header says so.  This probe settles them.
# Historical probe -- kept as EVIDENCE, not as a regression test.  It must NEVER
# fail on a measurement outcome: the point is to SEE the numbers, so only a
# compile error is allowed to redden a job.  Manual trigger ONLY.
#
# The library under test is VENDORED byte-exact into probe-assets/thread_cpu/;
# nothing here writes to the Performant_Isabelle_ML repository.
#
# macOS, on BOTH arm64 (macos-14) and Intel (macos-15-intel -- macos-13 is
# retired and jobs on it queue forever):
#
#   M1  does the current macOS branch compile as-is (clang, -fPIC -shared, the
#       flags of library/threadcpu/build)?
#   M2  accuracy: a thread that burns CPU until 100 ms of wall clock has passed
#       -- by how much does its own clock advance?  A thread that sleeps 100 ms?
#       Does another thread reading a worker's clock through the handle see it
#       advance while the worker burns?  Cost of one tc_read over 1e6 reads.
#   M3  THE SHARP ONE -- post-exit behaviour of the CURRENT branch, which takes
#       NO reference (pthread_mach_thread_np adds none): after the worker thread
#       has exited and been joined, does tc_read on its handle return -1 because
#       thread_info fails, or does it still succeed?  Polled for up to 1 s.
#   M4  port-name reuse under the CURRENT branch: after the worker exits, churn
#       ~200 short-lived threads (and then 32 simultaneously live ones), then
#       read the STALE handle again.  -1, the dead worker's final total, or
#       something else -- e.g. a small number, meaning the Mach port name was
#       recycled for a DIFFERENT thread and the shim is now silently reporting
#       the wrong thread's CPU time?  Raw values reported.
#   M5  the candidate fix, probe-assets/thread_cpu/threadcpu_sendright.c: the
#       macOS branch (and ONLY the macOS branch) changed so that tc_self also
#       takes a send right with mach_port_mod_refs(..., MACH_PORT_RIGHT_SEND, 1)
#       and tc_free gives it back with mach_port_deallocate.  Does it compile?
#       M3 and M4 repeated against it; plus the mach_port_deallocate return code,
#       which the void signature of tc_free hides (the variant exports an extra
#       tc_free_rc so the probe can see it).
#
# Windows (windows-latest, mingw64 gcc from msys2, as library/threadcpu/build does):
#
#   W1  does the Windows branch compile with mingw64 gcc, -m64 -shared, to
#       threadcpu.dll?
#   W2  accuracy as in M2.  Threads here are Win32 CreateThread, not pthreads.
#   W3  RESOLUTION of GetThreadTimes -- this settles an open dispute, and the
#       header of threadcpu.c explicitly says it must be settled before a Windows
#       CPU budget is trusted.  In a ~200 ms tight loop: how many DISTINCT
#       tc_read values are observed, what is the smallest non-zero step between
#       consecutive distinct values, and the largest?  QueryThreadCycleTime read
#       in the same loop, with QueryPerformanceCounter/Frequency as the time
#       reference, for comparison.  Then: burn exactly 3 ms of wall clock and
#       report by how much GetThreadTimes advanced -- 0 would mean the tick
#       granularity is coarser than 3 ms and no 3 ms budget can be enforced.
#   W4  post-exit: after the worker exits and is joined, does tc_read on the
#       DUPLICATED handle still return its final total, as the code's header
#       claims ("the duplicated handle keeps the thread object alive")?  And
#       what does a read return after tc_free has done the CloseHandle?
#
# Linux (ubuntu-latest) runs the same harness as a control, plus the library's
# own existing self-test test_threadcpu.c.
on:
  workflow_dispatch:

jobs:
  unix:
    name: "${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, macos-15-intel]
    steps:
      - uses: actions/checkout@v4

      - name: Machine
        run: |
          uname -a
          if [ "$(uname -s)" = Darwin ]; then
            sw_vers
            sysctl -n machdep.cpu.brand_string
            sysctl -n hw.ncpu
          else
            nproc
            grep -m1 'model name' /proc/cpuinfo || true
          fi

      # M1 (macOS) -- the compile itself is a question, so echo the command and
      # let a compile error fail the job.  Everything after this is measurement
      # and must not fail the job.
      - name: Build the CURRENT library (M1 / control)
        working-directory: probe-assets/thread_cpu
        run: |
          set -e
          if [ "$(uname -s)" = Darwin ]; then CC=clang; else CC=gcc; fi
          echo "===COMPILER==="
          $CC --version
          echo "===M1_BEGIN==="
          set -x
          $CC -O2 -fPIC -I. -Wall -Wextra -c -o threadcpu.o threadcpu.c
          $CC -fPIC -shared -o libthreadcpu.so threadcpu.o
          set +x
          echo "===M1_END=== exit=0 (compiled as-is)"
          ls -la libthreadcpu.so
          rm -f threadcpu.o

      - name: Build the SENDRIGHT variant (M5 compile)
        if: runner.os == 'macOS'
        working-directory: probe-assets/thread_cpu
        run: |
          set -e
          echo "===M5_COMPILE_BEGIN==="
          echo "--- diff against the vendored original: ---"
          diff -u threadcpu.c threadcpu_sendright.c || true
          set -x
          clang -O2 -fPIC -I. -Wall -Wextra -c -o sr.o threadcpu_sendright.c
          clang -fPIC -shared -o libthreadcpu_sendright.so sr.o
          set +x
          echo "===M5_COMPILE_END=== exit=0 (compiled)"
          nm -gU libthreadcpu_sendright.so || true
          rm -f sr.o

      - name: Build the probe harness
        working-directory: probe-assets/thread_cpu
        run: |
          set -e
          if [ "$(uname -s)" = Darwin ]; then
            clang -O2 -Wall -Wextra -I. -o tc_probe tc_probe.c -lpthread
          else
            gcc -O2 -Wall -Wextra -I. -o tc_probe tc_probe.c -ldl -lpthread
            gcc -O2 -fPIC -I. -o test_threadcpu test_threadcpu.c -ldl -lpthread
          fi
          ls -la tc_probe

      - name: RUN -- current library (M2 M3 M4 / control)
        working-directory: probe-assets/thread_cpu
        run: |
          set +e
          echo "===RUN_CURRENT_BEGIN==="
          ./tc_probe ./libthreadcpu.so current
          echo "exit=$?"
          echo "===RUN_CURRENT_END==="
          exit 0

      - name: RUN -- current library, second pass (is M3/M4 stable?)
        working-directory: probe-assets/thread_cpu
        run: |
          set +e
          echo "===RUN_CURRENT_2_BEGIN==="
          ./tc_probe ./libthreadcpu.so current-pass2
          echo "exit=$?"
          echo "===RUN_CURRENT_2_END==="
          exit 0

      - name: RUN -- sendright variant (M5)
        if: runner.os == 'macOS'
        working-directory: probe-assets/thread_cpu
        run: |
          set +e
          echo "===RUN_SENDRIGHT_BEGIN==="
          ./tc_probe ./libthreadcpu_sendright.so sendright
          echo "exit=$?"
          echo "===RUN_SENDRIGHT_END==="
          exit 0

      - name: RUN -- the library's own existing self-test (Linux control)
        if: runner.os == 'Linux'
        working-directory: probe-assets/thread_cpu
        run: |
          set +e
          echo "===RUN_SELFTEST_BEGIN==="
          ./test_threadcpu ./libthreadcpu.so
          echo "exit=$?"
          echo "===RUN_SELFTEST_END==="
          exit 0

  windows:
    name: "windows-latest (mingw64)"
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: Machine
        run: |
          uname -a
          gcc --version
          which gcc
          nproc

      # W1 -- the compile is a question; a compile error is allowed to fail here.
      - name: Build threadcpu.dll (W1)
        working-directory: probe-assets/thread_cpu
        run: |
          set -e
          export PATH="/mingw64/bin:$PATH"
          echo "===W1_BEGIN==="
          set -x
          gcc -O2 -I. -m64 -Wall -Wextra -c -o threadcpu.o threadcpu.c
          gcc -shared -o threadcpu.dll threadcpu.o
          set +x
          echo "===W1_END=== exit=0 (compiled as-is)"
          ls -la threadcpu.dll
          rm -f threadcpu.o

      - name: Build the probe harness
        working-directory: probe-assets/thread_cpu
        run: |
          set -e
          export PATH="/mingw64/bin:$PATH"
          gcc -O2 -m64 -Wall -Wextra -I. -o tc_probe.exe tc_probe.c
          ls -la tc_probe.exe

      - name: RUN -- W2 W3 W4
        working-directory: probe-assets/thread_cpu
        run: |
          set +e
          export PATH="/mingw64/bin:$PATH"
          echo "===RUN_WINDOWS_BEGIN==="
          ./tc_probe.exe ./threadcpu.dll windows
          echo "exit=$?"
          echo "===RUN_WINDOWS_END==="
          echo "===RUN_WINDOWS_2_BEGIN==="
          ./tc_probe.exe ./threadcpu.dll windows-pass2
          echo "exit=$?"
          echo "===RUN_WINDOWS_2_END==="
          exit 0
