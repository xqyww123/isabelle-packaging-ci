# Publish the `isabelle-nunchaku` component package to https://conda.qiyuan.me.
#
# The release chain (NUNCHAKU_FORK_PLAN.md in the MLML workspace): the fork
# xqyww123/nunchaku is tagged v<version> (VERSION file = single source); its CI
# builds, on each of five platforms, the nunchaku binary and the smbc the
# component bundles, smokes the assembled component against the exact Isabelle
# frontend flag table, and attaches to the GitHub release
# `nunchaku-bin-<isabelle-platform>`, `smbc-bin-<isabelle-platform>`, a .sha256
# for each, and `versions-<isabelle-platform>.txt` -- the two --version lines
# that leg captured under its own runtime.  This workflow stages that platform's
# pair next to the recipe, asserts the version record against the tag,
# rattler-builds the component package on a native runner (the recipe runs the
# binaries it packages, so it cannot cross-build), sanity-checks the layout, and
# publishes all five subdirs through the shared publish path.
#
# WHICH SOLVERS, WHICH BYTES: the fork's component/solvers.pins, which the recipe
# asserts its own pins against.  Nothing in this file is a solver literal.
#
#   conda subdir    Isabelle platform   runner
#   linux-64        x86_64-linux        ubuntu-latest
#   linux-aarch64   arm64-linux         ubuntu-24.04-arm
#   osx-64          x86_64-darwin       macos-15-intel
#   osx-arm64       arm64-darwin        macos-15
#   win-64          x86_64-cygwin       windows-latest
#
# Dispatch:
#     gh workflow run release-nunchaku --repo xqyww123/isabelle-packaging-ci \
#       -f version=0.5.3 -f dry_run=false
# NOTE dry_run DEFAULTS TO TRUE: a bare dispatch builds and validates but
# publishes nothing.
#
# DO NOT DISPATCH UNTIL THE FORK'S RELEASE IS OUT OF DRAFT.  The fork's
# release-assets job creates v<version> as a draft, uploads all twenty-five
# assets, asserts that the release carries exactly them, and only then
# un-drafts; a draft release is NOT served at
# releases/download/..., so every leg here would 404 in its staging step, five
# legs deep, looking like "the fork's CI is broken".  The full six-step run plan
# is RELEASE_CHECKLIST.md section 9.
#
# Secrets: the shared CONDA_R2_* channel credentials.
name: release-nunchaku

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version -- must equal the fork's VERSION at tag v<version>"
        type: string
        required: true
      build_number:
        description: "conda build number - BUMP only to re-release the same version with fixed packaging"
        type: string
        default: "0"
      dry_run:
        description: "Build and test only -- do NOT publish to the channel"
        type: boolean
        default: true

concurrency:
  # Deliberately not keyed on the version: serialising two releases of the same
  # package is the behaviour we want, and cancel-in-progress: false means a
  # second dispatch waits rather than tearing a publish in half.
  group: release-nunchaku
  cancel-in-progress: false

jobs:
  build:
    name: "isabelle-nunchaku ${{ matrix.target.subdir }}"
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 60
    strategy:
      # One platform's failure must not hide the others'; `collect` below
      # refuses to publish unless all five arrived.
      fail-fast: false
      matrix:
        # An object-valued key, NOT `include:`.  `include` entries whose keys do
        # not appear in the base matrix are merged into every combination in
        # order, each overwriting the last -- so five of them yield legs all
        # wearing the LAST platform.  Measured in release-rocksdict, where the
        # first run produced three win-64 legs.
        target:
          - {subdir: linux-64,      isa_platform: x86_64-linux,   runner: ubuntu-latest,    rattler: rattler-build-x86_64-unknown-linux-musl}
          - {subdir: linux-aarch64, isa_platform: arm64-linux,    runner: ubuntu-24.04-arm, rattler: rattler-build-aarch64-unknown-linux-musl}
          # macos-15-intel, not macos-13: the macos-13 label is retired, so
          # those legs queue forever without ever being scheduled.
          - {subdir: osx-64,        isa_platform: x86_64-darwin,  runner: macos-15-intel,   rattler: rattler-build-x86_64-apple-darwin}
          - {subdir: osx-arm64,     isa_platform: arm64-darwin,   runner: macos-15,         rattler: rattler-build-aarch64-apple-darwin}
          - {subdir: win-64,        isa_platform: x86_64-cygwin,  runner: windows-latest,   rattler: rattler-build-x86_64-pc-windows-msvc.exe}
    defaults:
      run:
        shell: bash
    env:
      ISA_PLATFORM: ${{ matrix.target.isa_platform }}
      SUBDIR: ${{ matrix.target.subdir }}
      RECIPE_DIR: conda/components/isabelle-nunchaku
    steps:
      - uses: actions/checkout@v4

      # The solver versions this workflow asserts come from the recipe's own
      # `context:`, which the recipe's build script in turn asserts against the
      # fork's component/solvers.pins.  Before, they were four literals here
      # with no relation to either.
      - name: Read the solver pins
        run: .github/scripts/nunchaku-pins.sh "$RECIPE_DIR/recipe.yaml" >> "$GITHUB_ENV"

      - name: Stage this platform's CI-built binaries from the fork release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # A shape check on the dispatch input, first thing.  A dispatcher
          # typing `v0.5.3` otherwise produces `vv0.5.3` and a 404 five legs
          # deep; and passing the input through `env:` rather than interpolating
          # it into every `run:` body removes the expression-injection shape the
          # rest of this file already avoids for ISA_COMPONENT_VERSION.
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::version must be X.Y.Z, got '$VERSION'"; exit 1; }
          base="https://github.com/xqyww123/nunchaku/releases/download/v$VERSION"
          # A DRAFT release does not serve this URL -- see the header comment.

          # macOS runners have no sha256sum; both tools print "<hash>  <name>".
          sha256_check () {  # <expected-hash> <file>
            if command -v sha256sum > /dev/null 2>&1; then
              echo "$1  $2" | sha256sum -c
            else
              echo "$1  $2" | shasum -a 256 -c
            fi
          }

          for stem in nunchaku-bin smbc-bin; do
            asset="$stem-$ISA_PLATFORM"
            dst="$RECIPE_DIR/$stem"
            curl -fsSL -o "$dst" "$base/$asset"
            # The sidecar catches a torn or corrupted DOWNLOAD -- and nothing
            # more.  It is written and uploaded by the same fork job that
            # uploads the payload, with --clobber, so it cannot bind the asset
            # to the tag; what does that is the git sha the binary itself
            # reports, asserted below on win-64 and in the recipe's build script
            # on the other four.
            curl -fsSL -o "$dst.sha256.txt" "$base/$asset.sha256"
            sha256_check "$(cut -d' ' -f1 "$dst.sha256.txt")" "$dst"
            chmod +x "$dst"

            # The link footprint that makes the artifact redistributable on this
            # platform.  Same three checks the fork's own release legs run, from
            # the other side of the handover.
            case "$ISA_PLATFORM" in
              *-linux)
                # INTERP is an ELF program-header NAME -- locale- and
                # wording-independent, unlike ldd's message.  The fork builds
                # these musl-static, so there must be no program interpreter.
                # A private temp file, not a fixed name in the workspace reused
                # across loop iterations.
                rl=$(mktemp)
                readelf -l "$dst" > "$rl"
                ! grep -q INTERP "$rl" \
                  || { echo "::error::$asset is dynamically linked"; exit 1; }
                rm -f "$rl"
                ;;
              *-darwin)
                # macOS has no static libSystem; "static enough" means nothing
                # outside /usr/lib.  otool's first line is the file's own name.
                rest=$(otool -L "$dst" | tail -n +2 | grep -v '/usr/lib/' || true)
                [ -z "$rest" ] \
                  || { echo "::error::$asset links outside /usr/lib:"; echo "$rest"; exit 1; }
                ;;
              *-cygwin)
                # cygcheck is a Cygwin tool and this runner has no Cygwin; the
                # fork's win-64 leg ran it there, under the runtime these
                # binaries actually use.  What IS checkable here is that the
                # payload is a PE at all, so a truncated download or an HTML
                # error page fails loudly instead of being packaged.
                python3 -c "import sys; sys.exit(0 if open(sys.argv[1],'rb').read(2)==b'MZ' else 1)" "$dst" \
                  || { echo "::error::$asset is not a PE executable"; exit 1; }
                ;;
              *)
                echo "::error::unhandled platform $ISA_PLATFORM"; exit 1 ;;
            esac
          done

          # ---------------------------------------------------------------
          # the version record, asserted -- on ALL FIVE legs
          # ---------------------------------------------------------------
          # versions-<platform>.txt is written by the fork's release-smoke.sh on
          # the leg itself, under that platform's own runtime, and attached with
          # the binaries.  On the four unix legs this cross-checks assertions
          # that also run directly (here, and again in the recipe's build
          # script).  On x86_64-cygwin it is the ONLY binding there is: those two
          # binaries are Cygwin-ABI, they need cygwin1.dll from the base
          # `isabelle` package, and no runner in this repository has it -- so
          # without this file the entire content check on them is the two bytes
          # "MZ" above.
          tag_sha=$(git ls-remote https://github.com/xqyww123/nunchaku.git \
                      "refs/tags/v$VERSION^{}" | cut -f1)
          [ -n "$tag_sha" ] \
            || { echo "::error::annotated tag v$VERSION not found upstream"; exit 1; }
          echo "TAG_SHA=$tag_sha" >> "$GITHUB_ENV"

          vf="$RUNNER_TEMP/versions-$ISA_PLATFORM.txt"
          curl -fsSL -o "$vf" "$base/versions-$ISA_PLATFORM.txt"
          echo "===== versions-$ISA_PLATFORM.txt ====="; cat "$vf"
          nun_line=$(sed -n 's/^nunchaku-bin --version: //p' "$vf")
          smbc_line=$(sed -n 's/^smbc-bin --version: //p' "$vf")
          # "nunchaku <version> <40-hex>" -- src/main/dune generates
          # GitVersion.ml from `git rev-parse HEAD`.
          # Deliberately unquoted: the line is being split into its three fields.
          # shellcheck disable=SC2086
          set -- $nun_line
          if [ "$#" -ne 3 ] || [ "$1" != nunchaku ]; then
            echo "::error::unreadable nunchaku version line: '$nun_line'"; exit 1
          fi
          [ "$2" = "$VERSION" ] \
            || { echo "::error::the fork's $ISA_PLATFORM leg built version '$2', not '$VERSION'"; exit 1; }
          # Shape before comparison, and both values QUOTED in the message.
          # Without the shape check a CR at the end of the record (a CRLF
          # checkout on the win-64 leg) prints two shas that look identical:
          # measured 2026-08-25, `built from ddcbdcf... , not from tag v0.5.3
          # (ddcbdcf...)`.  The fork asserts the same shape where the record is
          # written (release-smoke.sh); this is the reading end of it.
          case "$3" in
            *[!0123456789abcdef]*) hex=no ;;
            *)                     hex=yes ;;
          esac
          if [ "$hex" != yes ] || [ "${#3}" -ne 40 ]; then
            echo "::error::the record's commit field is not 40 lowercase hex; it is ${#3} characters: '$3'"
            exit 1
          fi
          [ "$3" = "$tag_sha" ] \
            || { echo "::error::the fork's $ISA_PLATFORM binary was built from '$3', not from tag v$VERSION ('$tag_sha')"; exit 1; }
          [ "$smbc_line" = "version: $SMBC_VERSION" ] \
            || { echo "::error::the fork's $ISA_PLATFORM leg bundled smbc '$smbc_line', expected 'version: $SMBC_VERSION'"; exit 1; }
          echo "  OK  $ISA_PLATFORM: nunchaku $VERSION @ $tag_sha, smbc $SMBC_VERSION"

          # Executing the binaries adds nothing on win-64 (see above) and is a
          # direct check on the other four.
          if [ "$ISA_PLATFORM" != "x86_64-cygwin" ]; then
            "$RECIPE_DIR/nunchaku-bin" --version > nun-version.txt
            grep -Fqx "$nun_line" nun-version.txt \
              || { echo "::error::the staged binary reports '$(cat nun-version.txt)', not the attached record '$nun_line'"; exit 1; }
            "$RECIPE_DIR/nunchaku-bin" --help > /dev/null
            "$RECIPE_DIR/smbc-bin" --version > smbc-version.txt 2>&1
            grep -Fqx "version: $SMBC_VERSION" smbc-version.txt \
              || { echo "::error::staged smbc reports '$(cat smbc-version.txt)', expected version: $SMBC_VERSION"; exit 1; }
          fi

      - name: Install rattler-build
        run: |
          set -euo pipefail
          # Mapped explicitly in the matrix; do NOT interpolate `uname -m`.
          # rattler-build's assets say `aarch64` while macOS reports `arm64`,
          # so the uname form 404s there while working by coincidence on
          # linux-aarch64 -- a bug that shows up on one platform only.
          curl -fsSL -o rattler-build \
            "https://github.com/prefix-dev/rattler-build/releases/download/v0.69.1/${{ matrix.target.rattler }}"
          chmod +x rattler-build
          ./rattler-build --version

      - name: Build the component package
        env:
          ISA_COMPONENT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ./rattler-build build \
            --recipe "$RECIPE_DIR/recipe.yaml" \
            --output-dir out \
            --target-platform "$SUBDIR" \
            --build-num "${{ inputs.build_number }}" \
            -c https://conda.qiyuan.me -c conda-forge
          find out -name '*.conda' -print

      - name: "Sanity: layout, hooks, version injection, dependency bound"
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          pkg=$(find out -name 'isabelle-nunchaku-*.conda' | head -1)
          [ -n "$pkg" ] || { echo "::error::no package produced"; exit 1; }
          # macOS runners' system python is PEP 668 "externally managed", so a
          # plain pip install fails there while working on linux and windows.
          python3 -m pip install --quiet zstandard \
            || python3 -m pip install --quiet --break-system-packages zstandard
          work=$(mktemp -d)
          python3 - "$pkg" "$work" <<'PY'
          import io, sys, tarfile, zipfile, zstandard
          z = zipfile.ZipFile(sys.argv[1])
          for member in z.namelist():
              if member.startswith(("pkg-", "info-")) and member.endswith(".tar.zst"):
                  r = zstandard.ZstdDecompressor().stream_reader(io.BytesIO(z.read(member)))
                  tarfile.open(fileobj=io.BytesIO(r.read())).extractall(sys.argv[2])
          PY

          # info/recipe/ cleanliness.  rattler-build copies the recipe directory
          # into the package, honouring the enclosing git work tree's ignore
          # rules -- so this rests on two things nothing used to record:
          # conda/components/isabelle-nunchaku/.gitignore, and the build
          # happening inside a checkout.  Measured 2026-08-25: with both, three
          # yaml files; with either missing, the two staged binaries as well --
          # a second compressed copy of ~20 MB in each of the five packages.
          find "$work/info/recipe" -type f | sort
          stray=$(find "$work/info/recipe" -type f ! -name '*.yaml' | head -5)
          [ -z "$stray" ] \
            || { echo "::error::info/recipe carries non-yaml files (a lost .gitignore line, or a build outside a git checkout):"; echo "$stray"; exit 1; }

          # The peeled tag was resolved and asserted in the staging step; TAG_SHA
          # comes from there rather than being resolved a second time, so the
          # binaries and the packaged tree are checked against ONE value.
          # (`^{}` is the PEELED ref, which only ANNOTATED tags have -- a
          # lightweight v<version> fails there with "tag not found upstream",
          # which is the intended prompt to re-tag with `git tag -a`.)
          WORK="$work" PLAT="$ISA_PLATFORM" SUBDIR="$SUBDIR" python3 - <<'PY'
          import json, os, pathlib, re

          work = pathlib.Path(os.environ["WORK"])
          plat = os.environ["PLAT"]
          subdir = os.environ["SUBDIR"]
          version = os.environ["VERSION"]
          tag_sha = os.environ["TAG_SHA"]
          exe = ".exe" if plat.endswith("-cygwin") else ""
          name = "isabelle-nunchaku"
          comp = work / "share" / name

          def die(msg):
              raise SystemExit(f"::error::{msg}")

          settings = (comp / "etc" / "settings").read_text()
          if f'NUNCHAKU_VERSION="{version}"' not in settings:
              die(f"etc/settings does not carry NUNCHAKU_VERSION={version}")
          # The platform placeholder must have been substituted with THIS
          # package's platform -- a package whose settings named another
          # platform's directory would install and then find nothing.
          if f'NUNCHAKU_HOME="$COMPONENT/{plat}"' not in settings:
              die(f"etc/settings does not point NUNCHAKU_HOME at {plat}:\n{settings}")

          commit = (comp / "COMMIT").read_text()
          for line in ("base", "build"):
              if not re.search(rf"^{line} [0-9a-f]{{40}}$", commit, re.M):
                  die(f"COMMIT lacks the {line} line")
          if f"build {tag_sha}" not in commit:
              die(f"COMMIT build sha does not match tag v{version} ({tag_sha})")

          for rel in ["nunchaku", f"nunchaku-bin{exe}",
                      f"solvers/cvc5{exe}", f"solvers/smbc{exe}"]:
              if not (comp / plat / rel).is_file():
                  die(f"{plat}/{rel} is not in the payload")
          for rel in ["LICENSE", "LICENSE-cvc5", "LICENSE-smbc"]:
              if not (comp / rel).is_file():
                  die(f"{rel} is not in the payload")

          # BOTH hook families, on EVERY subdir.  conda picks by the running
          # platform and returns success in silence when the file is absent, so
          # a .sh-only package installs cleanly on Windows and is never
          # registered.  Four hooks, no more and no fewer: anything else is a
          # packaging bug.
          hooks = sorted(
              str(p.relative_to(work)).replace("\\", "/")
              for p in work.rglob(".*-post-link*")
          ) + sorted(
              str(p.relative_to(work)).replace("\\", "/")
              for p in work.rglob(".*-pre-unlink*")
          )
          expected = sorted([f"bin/.{name}-post-link.sh",
                             f"Scripts/.{name}-post-link.bat",
                             f"bin/.{name}-pre-unlink.sh",
                             f"Scripts/.{name}-pre-unlink.bat"])
          if sorted(hooks) != expected:
              die(f"unexpected link hooks\ngot:\n{sorted(hooks)}\nexpected:\n{expected}")
          if b"\r\n" not in (work / "Scripts" / f".{name}-post-link.bat").read_bytes():
              die("the .bat hook is not CRLF")

          idx = json.loads((work / "info" / "index.json").read_text())
          deps = idx.get("depends", [])
          print("depends =", deps)
          # maxsplit by keyword: passing it positionally is deprecated since
          # python 3.13 (the runners are on 3.12 today).
          names = sorted(re.split(r"[ <>=!]", d, maxsplit=1)[0] for d in deps)
          if names != ["isabelle"]:
              die(f"expected exactly the isabelle series bound, got {deps}")
          if idx.get("subdir") != subdir:
              die(f"expected {subdir}, got {idx.get('subdir')}")
          print(f"  OK  {subdir}, {plat} payload, four hooks, isabelle series bound")
          PY

      # rattler-build already writes out/<subdir>/*.conda; `collect` flattens the
      # per-leg artifacts into the single <subdir>/ tree publish-conda.yml takes.
      - uses: actions/upload-artifact@v4
        with:
          name: nunchaku-${{ matrix.target.subdir }}
          path: out/**/*.conda
          if-no-files-found: error

  # publish-conda.yml takes ONE artifact laid out as <subdir>/*.conda, so the
  # per-leg artifacts are merged into that shape here rather than teaching the
  # shared workflow about matrices.  Deliberately NOT gated on dry_run: the
  # "all five subdirs arrived" assertion is exactly what a dry run is for, and
  # uploading an artifact nobody publishes costs nothing.
  collect:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nunchaku-*
          path: ${{ runner.temp }}/legs
      - uses: actions/checkout@v4
      - name: Merge into <subdir>/ layout
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/merged"
          # each leg already contains out/<subdir>/<pkg>.conda; flatten one level
          find "$RUNNER_TEMP/legs" -name '*.conda' | while read -r f; do
            sub=$(basename "$(dirname "$f")")
            mkdir -p "$RUNNER_TEMP/merged/$sub"
            cp "$f" "$RUNNER_TEMP/merged/$sub/"
          done
          echo "===== merged ====="
          find "$RUNNER_TEMP/merged" -name '*.conda' | sort

          # The expected subdir list comes from the BUILD MATRIX in this same
          # file, read out of it rather than restated: it used to be a literal
          # `linux-64 linux-aarch64 osx-64 osx-arm64 win-64` here plus a literal
          # `5`, a third and fourth copy of a list that also lives in the matrix
          # and in the recipe's own PLATFORMS table.  (Those first two duplicate
          # deliberately -- the sanity step cross-checks them, and a cross-check
          # needs two independent statements.  These two bought nothing.)
          # PyYAML is not guaranteed on the runner's system python; install it
          # rather than bet the gate on it.  Parsing the YAML, not grepping it:
          # a regex over the matrix would keep working until someone reformats
          # the block and then silently return an empty list.
          python3 -c "import yaml" 2>/dev/null \
            || python3 -m pip install --quiet pyyaml \
            || python3 -m pip install --quiet --break-system-packages pyyaml
          expected=$(python3 - <<'PY'
          import re, yaml
          w = yaml.safe_load(open(".github/workflows/release-nunchaku.yml"))
          rows = w["jobs"]["build"]["strategy"]["matrix"]["target"]
          subs = sorted(r["subdir"] for r in rows)
          assert len(subs) >= 2 and len(set(subs)) == len(subs), subs
          # Derived from the matrix, this count would agree with itself even if
          # a row were dropped -- four subdirs would publish, green.  So check
          # it against the recipe's own PLATFORMS table, which is asserted
          # against component/solvers.pins on every build: the number that
          # gates publication then descends from the pins file rather than from
          # the matrix it is checking.
          src = open("conda/components/isabelle-nunchaku/recipe.yaml").read()
          # Anchor on the assignment at the start of a line, not on the first
          # occurrence of the text: a mention inside a comment would otherwise
          # be taken as the table and yield an empty key list, which agrees
          # with nothing and fails -- or, if a comment ever preceded a real
          # table, could yield a shorter one that happens to agree.
          m = re.search(r'^\s*PLATFORMS = \{', src, re.M)
          if not m:
              raise SystemExit("::error::recipe.yaml has no PLATFORMS table")
          body = src[m.start():]
          body = body[:body.index("}") + 1]
          keys = sorted(re.findall(r'"([a-z0-9_-]+)"\s*:', body))
          if not keys:
              raise SystemExit("::error::recipe.yaml's PLATFORMS table parsed empty")
          if keys != subs:
              raise SystemExit(f"::error::the build matrix names {subs} but the "
                               f"recipe's PLATFORMS names {keys}")
          print(" ".join(subs))
          PY
          )
          echo "the matrix names: $expected"
          # The python above cannot return an empty list (it asserts >= 2 and
          # agreement with the recipe), but `want` below is a word count: if
          # $expected were ever empty, `want` would be 0 and a run that built
          # nothing would satisfy the gate.  Structural rather than remembered.
          [ -n "$expected" ] || { echo "::error::the subdir list came back empty"; exit 1; }
          n=$(find "$RUNNER_TEMP/merged" -name '*.conda' | wc -l)
          # One per platform, no more and no fewer.  A partial publish is the
          # failure this catches: fail-fast is off, so a red leg leaves four good
          # packages that would otherwise go out as if the release were whole.
          want=$(echo "$expected" | wc -w)
          [ "$n" -eq "$want" ] || { echo "::error::expected exactly $want packages, found $n"; exit 1; }
          for sub in $expected; do
            ls "$RUNNER_TEMP/merged/$sub"/*.conda > /dev/null \
              || { echo "::error::no package for $sub"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: conda-packages
          path: ${{ runner.temp }}/merged/**/*.conda
          if-no-files-found: error

  # RECOVERY, if this job fails partway: re-run FAILED JOBS, or bump
  # build_number.  A fresh dispatch does NOT substitute -- it rebuilds, and a
  # rebuilt .conda is not byte-identical (info/index.json carries a timestamp),
  # so the channel's content-comparing immutability guard correctly refuses it
  # and the re-dispatch dead-ends.  Same rule as RELEASE_CHECKLIST.md section 9
  # item 4.
  publish:
    needs: collect
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/publish-conda.yml
    with:
      artifact: conda-packages
      package_name: isabelle-nunchaku
    secrets:
      CONDA_R2_ACCESS_KEY_ID:     ${{ secrets.CONDA_R2_ACCESS_KEY_ID }}
      CONDA_R2_SECRET_ACCESS_KEY: ${{ secrets.CONDA_R2_SECRET_ACCESS_KEY }}

  smoke:
    name: "Smoke: conda install from conda.qiyuan.me (${{ matrix.runner }})"
    needs: publish
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false          # one platform's failure must not hide the others
      # One runner per published subdir.  windows-latest is mandatory, not
      # optional: a win-64 registration failure is silent and cannot be inferred
      # from a green Linux leg (RELEASE_CHECKLIST.md section 10, and the history
      # in ROLLOUT_STATUS.md).
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-latest]
    defaults:
      run:
        # bash -l (LOGIN shell), not plain bash: setup-miniconda only puts
        # `conda` on PATH via the profile a login shell sources.
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          # ubuntu-24.04-arm, macos-15 and macos-15-intel ship NO conda.  Checked
          # 2026-08-25 against actions/runner-images: the arm64 Ubuntu image's
          # README has an EMPTY `CONDA` row, and neither macOS 15 README mentions
          # conda at all, while the x64 Ubuntu and Windows images do ship
          # Miniconda.  Without this the action keeps useBundled, resolves its
          # base path to an empty $CONDA and throws "No installed conda 'base'
          # environment found" (setup-miniconda src/setup.ts) -- i.e. three of
          # the five smoke legs could never start.  The one other workflow here
          # with an ARM smoke leg (release.yml) already spells it this way; the
          # bare spelling was copied from two ubuntu-latest-only jobs.
          miniforge-version: latest
          auto-update-conda: true
          # No python-version: the job immediately creates its own `smoke`
          # environment and never uses setup-miniconda's base.

      # The two solver versions asserted below, from the recipe's context via
      # the fork's solvers.pins -- not literals.  See the build job.
      - name: Read the solver pins
        run: .github/scripts/nunchaku-pins.sh >> "$GITHUB_ENV"

      - name: Install and verify the component end-to-end
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          conda create -y -n smoke -c https://conda.qiyuan.me -c conda-forge \
            "isabelle-nunchaku=$VERSION"
          conda activate smoke
          comp="$CONDA_PREFIX/share/isabelle-nunchaku"
          # Windows puts the entry point in Scripts/, everyone else in bin/.
          if [ -x "$CONDA_PREFIX/bin/isabelle" ]; then
            ISA="$CONDA_PREFIX/bin/isabelle"
          else
            ISA="$CONDA_PREFIX/Scripts/isabelle.bat"
          fi
          echo "entry point: $ISA"

          # The post-link hook registered the component with the base isabelle.
          # This is the assertion that carries the whole Windows leg: read the
          # registration, never infer it.
          #
          # `tr -d '\r'` on every reading: isabelle.bat's output reaches a
          # Git-Bash step with CRLF line endings, and an exact-match assertion
          # would fail on the carriage return alone -- a Windows-only red on a
          # perfectly good package.  This repository has a whole probe workflow
          # (win-crlf-hunt) about that class of defect.
          getenv () { "$ISA" getenv -b "$1" | tr -d '\r'; }

          # This half is sound and non-vacuous: measured, the base distribution
          # answers 0.5, so 0.5.3 is unreachable without a real registration.
          v_now=$(getenv NUNCHAKU_VERSION)
          [ "$v_now" = "$VERSION" ] \
            || { echo "::error::NUNCHAKU_VERSION is '$v_now', expected $VERSION"; exit 1; }
          nun_home=$(getenv NUNCHAKU_HOME)
          echo "NUNCHAKU_HOME=$nun_home"
          # The settings point at the one platform directory this package ships,
          # and that directory is really there with both bundled solvers in it.
          case "$nun_home" in
            *"/share/isabelle-nunchaku/"*) ;;
            *) echo "::error::NUNCHAKU_HOME is not this component: $nun_home"; exit 1 ;;
          esac
          plat=${nun_home##*/}
          for rel in nunchaku solvers/cvc5 solvers/smbc; do
            ls "$comp/$plat/$rel"* > /dev/null \
              || { echo "::error::$plat/$rel is missing from the installed component"; exit 1; }
          done

          # Redirect and then grep the file, never `prog | grep -q`: grep exits
          # on the first match and a still-writing producer dies of SIGPIPE,
          # which under `set -o pipefail` fails the step.  The versions come
          # from the pins, never from a literal here.
          if [ "$plat" = "x86_64-cygwin" ]; then
            # cvc5 is a native Windows binary and runs here.  nunchaku-bin and
            # smbc are Cygwin-ABI and need the isabelle package's own Cygwin,
            # which a Git-Bash step is not; the fork's win-64 release leg runs
            # them under exactly that Cygwin and records the result in
            # versions-x86_64-cygwin.txt, which the build job asserted against
            # the release tag before packaging.  The one thing still not
            # measured anywhere is the INSTALLED wrapper on Windows resolving
            # its two solvers -- RELEASE_CHECKLIST.md section 9 step 5 schedules
            # that measurement inside the dry-run window, and the invocation
            # gets folded in here once it has been made.
            "$comp/$plat/solvers/cvc5.exe" --version > cvc5-version.txt
          else
            "$comp/$plat/nunchaku" --help > /dev/null
            "$comp/$plat/solvers/cvc5" --version > cvc5-version.txt
            "$comp/$plat/solvers/smbc" --version > smbc-version.txt 2>&1
            grep -Fqx "version: $SMBC_VERSION" smbc-version.txt \
              || { echo "::error::installed smbc reports '$(head -1 smbc-version.txt)', expected version: $SMBC_VERSION"; exit 1; }
          fi
          # -F and the trailing space: the measured line is
          # "cvc5 1.3.4 [git f3b21c4 on branch HEAD]", and `grep 'cvc5 1.3.4'`
          # with unescaped dots also matches `cvc5 1x3y4` and `cvc5 1.3.44`.
          grep -Fq "cvc5 $CVC5_VERSION " cvc5-version.txt \
            || { echo "::error::installed cvc5 reports '$(head -1 cvc5-version.txt)', expected cvc5 $CVC5_VERSION"; exit 1; }

          # ---------------------------------------------------------------
          # the uninstall half: READ the registration, never infer it
          # ---------------------------------------------------------------
          # The check that used to stand here compared NUNCHAKU_VERSION before
          # and after, and could not fail.  Two independent reasons, both
          # measured 2026-08-25:
          #
          #   * `conda remove` deletes share/isabelle-nunchaku/etc/settings
          #     whether or not the pre-unlink ran, so NUNCHAKU_VERSION stops
          #     being this release UNCONDITIONALLY -- measured v_after='0.5'
          #     with the registration still sitting in etc/components, after
          #     which every later `isabelle` call prints "### Missing Isabelle
          #     component: ...".  A package shipping NO .bat pre-unlink at all
          #     passed that check.
          #   * without --force, conda prunes base `isabelle` as an orphaned
          #     dependency (conda 25.11.1), and ITS pre-unlink deletes the
          #     namespaced ISABELLE_HOME_USER -- after which $ISA does not
          #     exist, `getenv` fails, `|| true` swallows it, and the assertion
          #     passes on an empty string produced by a missing interpreter.
          #
          # (The old comment here also claimed NUNCHAKU_VERSION falls back to
          # the empty string because scripts/pack.sh unregisters the dead
          # contrib/nunchaku-0.5.  Measured against both the Isabelle2025-2
          # distribution and the published isabelle 2025.2: it is `0.5`.)
          comps="$(getenv ISABELLE_HOME_USER)/etc/components"
          # On Windows `isabelle getenv` answers /cygdrive/c/...; Git-Bash needs /c/...
          case "$comps" in /cygdrive/*) comps="/${comps#/cygdrive/}" ;; esac
          echo "components file: $comps"
          grep -qF "share/isabelle-nunchaku" "$comps" \
            || { echo "::error::post-link did not register the component in $comps"; exit 1; }
          conda remove -y --force isabelle-nunchaku
          ! grep -qF "share/isabelle-nunchaku" "$comps" \
            || { echo "::error::pre-unlink left a stale registration in $comps"; exit 1; }
          echo "smoke OK"
