# The download counter of conda.qiyuan.me: index.js. Deploy it, and query its database,
# with scripts/download-counter.py (deploy, sql). It counts what its route sends it; our
# own pipelines download from https://conda-ci.qiyuan.me, which no route covers
# (CHANNEL_OPERATIONS.md).
#
# `download-counter.py deploy` mints the deploy token with CLOUDFLARE_GOD_KEY (wrangler
# never gets secret.sh's CLOUDFLARE_API_TOKEN), deploys this directory as committed at
# HEAD, and PUTs the route's request_limit_fail_open back to true. Every `wrangler deploy`
# recreates the route with it off; with it on, requests past the free plan's daily request
# limit skip the Worker instead of getting error 1027.
#
# Test a change only against a local origin (`wrangler dev --local --local-upstream
# 127.0.0.1:<port> --upstream-protocol http --persist-to <fresh dir>`); without
# `--local-upstream`, wrangler dev forwards to https://conda.qiyuan.me, through the live
# Worker, and is counted.
name = "conda-download-counter"
main = "index.js"
compatibility_date = "2026-10-01"
routes = [{ pattern = "conda.qiyuan.me/*", zone_name = "qiyuan.me" }]

[[d1_databases]]
binding = "DB"
database_name = "conda-downloads"
