schema_version: 1

# isabelle-nunchaku: the maintained Nunchaku model finder (fork of
# nunchaku-inria/nunchaku) as an Isabelle component, packaged as a conda add-on
# to the base `isabelle` package.  Per-platform, five subdirs (NOT noarch: it
# carries native binaries).  Closest precedent for the shape:
# isabelle-semantic-embedding, which is also a five-subdir arch package.
#
# The component makes Isabelle2025-2's `nunchaku` command actually work: the
# distribution registers a 2017 binary (self-reported 0.1) that does not know
# the `cvc5` solver name the 2025-2 frontend sends, and always sets
# NUNCHAKU_HOME pointing at it.  This component's etc/settings wins over the
# distribution's (user-side components are evaluated later), and sets
# NUNCHAKU_VERSION so version-gated consumers can tell a working install from
# the bundled one.
#
# Inputs, all explicit:
#   - env ISA_COMPONENT_VERSION: the release version; must equal the VERSION
#     file in the fork checkout (asserted below).  CI reads VERSION and exports
#     it -- versions are never written by hand (house rule).
#   - git source: the fork at tag v<version> -- supplies the wrapper,
#     etc/settings skeleton, VERSION and LICENSE.
#   - url source: the official static cvc5 release for this platform,
#     sha256-pinned.
#   - path sources ./nunchaku-bin and ./smbc-bin: the two binaries the fork's
#     CI built and attached to the release, staged next to this recipe before
#     building.  They are NOT built here -- precedent: Semantic_Embedding's
#     recipe, "THE TWO NATIVE ARTIFACTS ARE NOT BUILT HERE".  smbc arrives the
#     same way as nunchaku (sha256-pinned, from a named release) rather than as
#     a vendored blob, so it has the same provenance chain and the same
#     re-certification trigger.  Neither `path:` source carries a `sha256:` of
#     its own -- rattler-build would accept one, but the digest would have to be
#     injected per platform from CI.  The real digest check is the workflow's
#     (release-nunchaku.yml stages each binary against the release's `.sha256`
#     sidecar), so a HAND-RUN `rattler-build build` does NOT perform it: it
#     validates the layout of whatever binaries happen to sit in this directory.

context:
  version: ${{ env.get("ISA_COMPONENT_VERSION", default="0.0.0") }}
  # The upstream commit the fork is pinned to.  Deliberately a recipe constant:
  # syncing the fork to a new upstream base is a re-certification event, and
  # bumping this line is part of that same conscious change.
  upstream_base_short: d23a876
  upstream_base_full: d23a876d788e9d7fb59ec58a003cf1d0765723f1
  # The two bundled solvers, pinned.
  #
  # These are NOT the source of truth: the fork's component/solvers.pins is, and
  # the build script dies unless every value here -- both versions, all five
  # cvc5 digests below, and the subdir->platform table -- agrees with it.  They
  # are restated because rattler-build needs literals in `source:` and because
  # release-nunchaku.yml reads them out of this block
  # (.github/scripts/nunchaku-pins.sh), which is what keeps the workflow's
  # assertions from being a fourth independent copy.
  #
  # cvc5's version is asserted from the binary itself on ALL FIVE platforms (it
  # is a native binary everywhere).  nunchaku's and smbc's are asserted from the
  # binaries on the four non-Cygwin platforms; on win-64 they are Cygwin-ABI and
  # cannot run in a build environment, so there they are asserted from
  # versions-x86_64-cygwin.txt, which the fork's win-64 leg captured under
  # Isabelle's own Cygwin (release-nunchaku.yml checks it before staging).
  cvc5_version: "1.3.4"
  smbc_version: "0.6.1"
  # The five cvc5 digests.  `source:` needs a literal, so they live here rather
  # than being read from the fork -- and every one of them is asserted against
  # the fork's table in the build script, on every leg, not just this leg's own.
  cvc5_sha256_linux_64: dcdbfada0ce493ee98259c0816e0daafc561c223aadb3af298c2968e73ea39c6
  cvc5_sha256_linux_aarch64: 2a4c108367f20b0c8990abd6b9535a5d62e08908d471d4671c00734e408f85bc
  cvc5_sha256_osx_64: 5a7976affaf37dcf03ee44c3d0297c8e0ba08afd44ac832dab97400da726b852
  cvc5_sha256_osx_arm64: 3840aa53f6ee6fc357415dcfe291d7f5ffec6cfb1ccca6fef64120a0d2be4cb6
  cvc5_sha256_win_64: 279fe7e95810cfb62433fcfc2932f35325a665f32d3697ff33f75e31d5c6a179
  # smbc's licence, which the package must carry: it is a third bundled work and
  # 0.5.3 is the release that starts redistributing it.  sha256 measured
  # 2026-08-25 against c-cube/smbc@v0.6.1.
  smbc_license_sha256: 26a91735d09a69bcd0355a729282ea139d76e61475bc4adec6c23b493d643efb

package:
  name: isabelle-nunchaku
  version: ${{ version }}

source:
  - git: https://github.com/xqyww123/nunchaku.git
    rev: v${{ version }}
  # The official cvc5 release for THIS platform.  All five digests measured
  # 2026-08-25 against the cvc5-1.3.4 release assets.  rattler-build strips the
  # archive's single top-level directory, so each of these lands as
  # cvc5-dist/bin/cvc5 (cvc5.exe on win-64) and cvc5-dist/COPYING.
  - if: target_platform == "linux-64"
    then:
      - url: https://github.com/cvc5/cvc5/releases/download/cvc5-${{ cvc5_version }}/cvc5-Linux-x86_64-static.zip
        sha256: ${{ cvc5_sha256_linux_64 }}
        target_directory: cvc5-dist
  - if: target_platform == "linux-aarch64"
    then:
      - url: https://github.com/cvc5/cvc5/releases/download/cvc5-${{ cvc5_version }}/cvc5-Linux-arm64-static.zip
        sha256: ${{ cvc5_sha256_linux_aarch64 }}
        target_directory: cvc5-dist
  - if: target_platform == "osx-64"
    then:
      - url: https://github.com/cvc5/cvc5/releases/download/cvc5-${{ cvc5_version }}/cvc5-macOS-x86_64-static.zip
        sha256: ${{ cvc5_sha256_osx_64 }}
        target_directory: cvc5-dist
  - if: target_platform == "osx-arm64"
    then:
      - url: https://github.com/cvc5/cvc5/releases/download/cvc5-${{ cvc5_version }}/cvc5-macOS-arm64-static.zip
        sha256: ${{ cvc5_sha256_osx_arm64 }}
        target_directory: cvc5-dist
  - if: target_platform == "win-64"
    then:
      - url: https://github.com/cvc5/cvc5/releases/download/cvc5-${{ cvc5_version }}/cvc5-Win64-x86_64-static.zip
        sha256: ${{ cvc5_sha256_win_64 }}
        target_directory: cvc5-dist
  # smbc's licence text.  A third bundled work must travel with its licence, and
  # the upstream repository ships no licence file inside the built binary.
  - url: https://raw.githubusercontent.com/c-cube/smbc/v${{ smbc_version }}/LICENSE
    sha256: ${{ smbc_license_sha256 }}
    file_name: smbc-LICENSE
  - path: ./nunchaku-bin
    file_name: nunchaku-bin
  - path: ./smbc-bin
    file_name: smbc-bin

build:
  number: 0
  # The upstream base rides along in the build string (conda build strings do
  # not sort; hyphens are illegal there, underscore is fine).  build_number
  # follows `number` / the --build-num override, so re-releases keep unique
  # filenames (verified with rattler-build 0.69.1).
  string: ${{ upstream_base_short }}_${{ build_number }}
  # Static binaries: no RPATH to rewrite, no embedded prefix to patch.  Both
  # switches make the (pointless) default rewriting impossible instead of
  # merely unexercised.
  dynamic_linking:
    binary_relocation: false
  prefix_detection:
    ignore: true
  script:
    # Python, not bash: this recipe now builds on five platforms, and win-64's
    # build shell would be cmd.  One script that runs identically everywhere
    # beats a bash script plus a cmd translation of it -- the same reasoning as
    # isabelle-semantic-embedding's recipe, which is the live five-subdir
    # precedent.  `python` is a declared build requirement, so it is present by
    # construction rather than by luck.
    interpreter: python
    env:
      # rattler-build sanitizes the host environment; hand the version to the
      # script explicitly (same value as context.version).
      ISA_COMPONENT_VERSION: ${{ version }}
      NUNCHAKU_CVC5_VERSION: ${{ cvc5_version }}
      NUNCHAKU_SMBC_VERSION: ${{ smbc_version }}
      NUNCHAKU_UPSTREAM_BASE: ${{ upstream_base_full }}
      # All five, on every leg: the point is to catch a bump applied to one side
      # of the pipeline only, and four fifths of that would be invisible if each
      # leg checked only its own.
      NUNCHAKU_CVC5_SHA256S: >-
        linux-64=${{ cvc5_sha256_linux_64 }}
        linux-aarch64=${{ cvc5_sha256_linux_aarch64 }}
        osx-64=${{ cvc5_sha256_osx_64 }}
        osx-arm64=${{ cvc5_sha256_osx_arm64 }}
        win-64=${{ cvc5_sha256_win_64 }}
    content: |
      import os, pathlib, shutil, subprocess

      NAME    = "isabelle-nunchaku"
      SRC     = pathlib.Path(os.environ["SRC_DIR"])
      PREFIX  = pathlib.Path(os.environ["PREFIX"])
      TARGET  = os.environ["target_platform"]
      VERSION = os.environ["ISA_COMPONENT_VERSION"]
      CVC5    = os.environ["NUNCHAKU_CVC5_VERSION"]
      SMBC    = os.environ["NUNCHAKU_SMBC_VERSION"]
      BASE    = os.environ["NUNCHAKU_UPSTREAM_BASE"]

      def die(msg):
          print(f"::error::{msg}")
          raise SystemExit(1)

      # conda subdir -> (Isabelle platform id, executable suffix).  The Isabelle
      # ids come from the distribution's lib/scripts/isabelle-platform.  The
      # same string names the component's platform directory AND the fork's
      # release asset, so one value serves both and they cannot drift apart.
      PLATFORMS = {
          "linux-64":      ("x86_64-linux",  ""),
          "linux-aarch64": ("arm64-linux",   ""),
          "osx-64":        ("x86_64-darwin", ""),
          "osx-arm64":     ("arm64-darwin",  ""),
          "win-64":        ("x86_64-cygwin", ".exe"),
      }
      if TARGET not in PLATFORMS:
          die(f"unhandled target_platform {TARGET}")
      plat, exe = PLATFORMS[TARGET]

      # On win-64 the nunchaku and smbc binaries are Cygwin-ABI executables:
      # they need cygwin1.dll, which lives in the base `isabelle` package -- a
      # RUN dependency, absent from a build environment.  So they cannot be
      # executed here at all; what replaces those assertions there is described
      # at the `else:` branch that uses this flag.  cvc5 is a native binary on
      # every platform, so its pin is asserted everywhere.
      can_run_cygwin_abi = TARGET != "win-64"

      # single source of truth: the release version must be the fork's VERSION
      forks_version = (SRC / "VERSION").read_text().strip()
      if forks_version != VERSION:
          die(f"VERSION file ({forks_version}) != ISA_COMPONENT_VERSION ({VERSION})")

      # ------------------------------------------------------------------
      # the solver pins, against the fork's own table
      # ------------------------------------------------------------------
      # component/solvers.pins in the checked-out tag is where "which solver,
      # which bytes" is decided; everything in this recipe's `context:` is a
      # restatement that rattler-build's `source:` schema forces.  So assert
      # them, all of them, on every leg.  Without this the two repositories
      # pinned cvc5 with ten independent literals and nothing compared them: a
      # 1.3.5 bump applied to this recipe alone would have shipped a combination
      # the fork never smoked, with every gate on both sides green.
      pins_file = SRC / "component" / "solvers.pins"
      # Guarded, for the same reason first_line() is (see its comment below): an
      # unguarded read aborts with a FileNotFoundError traceback and no
      # `::error::` annotation, which is what every other failure in this script
      # produces.  Measured 2026-08-25 by removing the file from the tagged
      # tree -- the state of every tag before 0.5.3, so dispatching this
      # workflow with an older version is a plausible operator action.
      if not pins_file.is_file():
          die("the checked-out tag has no component/solvers.pins; this recipe "
              "can only package a tag that carries the pin table")
      pins, cvc5_rows = {}, {}
      for raw in pins_file.read_text().splitlines():
          f = raw.split("#", 1)[0].split()
          if not f:
              continue
          if f[0] == "cvc5" and len(f) == 4:
              cvc5_rows[f[1]] = (f[2], f[3])
          elif len(f) == 2:
              pins[f[0]] = f[1]
      if pins.get("cvc5-version") != CVC5:
          die(f"solvers.pins pins cvc5 {pins.get('cvc5-version')}, this recipe says {CVC5}")
      if pins.get("smbc-version") != SMBC:
          die(f"solvers.pins pins smbc {pins.get('smbc-version')}, this recipe says {SMBC}")
      # The subdir -> platform table below is deliberately independent of the
      # workflow's matrix (release-nunchaku.yml cross-checks the two).  This
      # makes it agree with the fork's platform list as well, so all three move
      # together or none of them do.
      if set(cvc5_rows) != {p for p, _ in PLATFORMS.values()}:
          die(f"solvers.pins covers {sorted(cvc5_rows)}, this recipe covers "
              f"{sorted(p for p, _ in PLATFORMS.values())}")
      recipe_digests = dict(kv.split("=", 1) for kv in os.environ["NUNCHAKU_CVC5_SHA256S"].split())
      for subdir, (p, _) in PLATFORMS.items():
          if cvc5_rows[p][1] != recipe_digests[subdir]:
              die(f"cvc5 for {p}: solvers.pins says {cvc5_rows[p][1]}, this "
                  f"recipe's source: says {recipe_digests[subdir]}")
      print(f"solver pins agree with the fork: cvc5 {CVC5}, smbc {SMBC}, "
            f"{len(cvc5_rows)} platforms, {len(recipe_digests)} digests")

      dest = PREFIX / "share" / NAME
      (dest / plat / "solvers").mkdir(parents=True, exist_ok=True)
      (dest / "etc").mkdir(parents=True, exist_ok=True)

      # ------------------------------------------------------------------
      # component skeleton from the fork
      # ------------------------------------------------------------------
      # etc/settings carries two placeholders and neither is ever written by
      # hand: the version comes from the VERSION file, the platform from the
      # one platform directory this package contains.  Naming that directory
      # literally is what makes it impossible for NUNCHAKU_HOME to point at a
      # directory the package does not ship (component/README.md).
      settings = (SRC / "component" / "etc" / "settings").read_text()
      settings = settings.replace("@NUNCHAKU_VERSION@", VERSION)
      settings = settings.replace("@NUNCHAKU_PLATFORM@", plat)
      if "@" in settings:
          die(f"etc/settings still has an unsubstituted placeholder:\n{settings}")
      (dest / "etc" / "settings").write_text(settings, newline="\n")
      for expected in (f'NUNCHAKU_VERSION="{VERSION}"', f'NUNCHAKU_HOME="$COMPONENT/{plat}"'):
          if expected not in settings:
              die(f"etc/settings does not carry {expected}")

      def install(src, dst):
          if not src.is_file():
              die(f"{src} is missing")
          shutil.copyfile(src, dst)
          dst.chmod(0o755)

      # ONE wrapper text, placed into whichever platform directory this package
      # is for.  It resolves its own directory at run time, so there is no
      # per-platform variant of it to keep in step.
      install(SRC / "component" / "nunchaku", dest / plat / "nunchaku")
      install(SRC / "nunchaku-bin", dest / plat / f"nunchaku-bin{exe}")
      install(SRC / "smbc-bin", dest / plat / "solvers" / f"smbc{exe}")
      install(SRC / "cvc5-dist" / "bin" / f"cvc5{exe}", dest / plat / "solvers" / f"cvc5{exe}")

      # ------------------------------------------------------------------
      # the bundled solver versions, asserted -- not prose
      # ------------------------------------------------------------------
      # The sha256 pins above already pin the artifacts; these assert the pins
      # are the intended ones.  cvc5 >= 1.3.1 is needed (the backend sends
      # get-model-domain-elements, which older cvc5 answers with an error);
      # smbc 0.6.1 is the version regress/README.md certifies.  Changing either
      # pin is a re-certification event, and these lines failing is its
      # intended prompt.
      def first_line(*cmd):
          # check=False plus an explicit die(): with check=True a non-zero exit
          # aborts with a CalledProcessError traceback and an empty output
          # aborts with an IndexError, both without the ::error:: annotation
          # every other failure here produces -- and on macOS a Gatekeeper kill
          # of a downloaded binary lands exactly here.
          out = subprocess.run(cmd, capture_output=True, text=True)
          lines = (out.stdout + out.stderr).splitlines()
          if out.returncode != 0 or not lines:
              die(f"{cmd[0]} {' '.join(cmd[1:])} exited {out.returncode} with "
                  f"stdout={out.stdout!r} stderr={out.stderr!r}")
          return lines[0]

      # ------------------------------------------------------------------
      # provenance FIRST: the binary assertions below need `head`
      # ------------------------------------------------------------------
      # COMMIT records the pinned upstream base and the fork commit actually
      # packaged; the ancestry assert makes a force-pushed or misdirected tag
      # fail here rather than ship.
      if subprocess.run(["git", "-C", str(SRC), "merge-base", "--is-ancestor", BASE, "HEAD"]).returncode != 0:
          die("checked-out tree does not descend from the pinned upstream base")
      head = subprocess.run(["git", "-C", str(SRC), "rev-parse", "HEAD"],
                            capture_output=True, text=True, check=True).stdout.strip()

      cvc5_line = first_line(str(dest / plat / "solvers" / f"cvc5{exe}"), "--version")
      print("cvc5:", cvc5_line)
      if f"cvc5 {CVC5} " not in cvc5_line:
          die(f"bundled cvc5 reports '{cvc5_line}', expected cvc5 {CVC5}")

      if can_run_cygwin_abi:
          smbc_line = first_line(str(dest / plat / "solvers" / f"smbc{exe}"), "--version")
          print("smbc:", smbc_line)
          if smbc_line != f"version: {SMBC}":
              die(f"bundled smbc reports '{smbc_line}', expected 'version: {SMBC}'")
          nun_line = first_line(str(dest / plat / f"nunchaku-bin{exe}"), "--version")
          print("nunchaku:", nun_line)
          if f" {VERSION} " not in nun_line:
              die(f"nunchaku-bin reports '{nun_line}', expected version {VERSION}")
          # ...AND from this tag's tree.  src/main/dune generates GitVersion.ml
          # from `git rev-parse HEAD`, and the binary prints
          # "nunchaku <version> <40-hex>", so this is the one check that binds
          # the 20 MB of machine code to the commit the 30 kB of shell is bound
          # to three ways already.  Without it the release asset -- which the
          # fork uploads with --clobber, and whose .sha256 sidecar the same job
          # writes -- only had to be "some 0.5.3-ish build".
          if not nun_line.endswith(head):
              die(f"nunchaku-bin reports '{nun_line}'; it was not built from the "
                  f"packaged tree {head} -- the release asset does not match the tag")

          # The wrapper must FIND its two solvers, not merely start.  Measured
          # 2026-08-25 on this exact packaged layout: `nunchaku --help` -- which
          # is all this line used to do -- passes with solvers/smbc at mode 644
          # AND with solvers/smbc deleted outright, and the frontend run then
          # still exits 0 and still prints SAT, answered by cvc5 alone, with the
          # loss visible only as a stderr warning no gate read.  That silent
          # half-loss is precisely the configuration the wrapper exists to
          # prevent (component/nunchaku:5-9) and precisely what 0.5.3 exists to
          # ship.  Both limbs below were measured to discriminate: silent on a
          # good layout, firing on a missing and on a non-executable smbc.
          #
          # It does NOT catch a present-and-executable-but-dead smbc; that one
          # is the fork's own release smoke (^SAT plus no BACKEND_ERROR on a
          # --solvers smbc run).  The two are complementary and both are needed.
          r = subprocess.run([str(dest / plat / "nunchaku"), "--no-color",
                              "--solvers", "cvc5,smbc", "--timeout", "30",
                              str(SRC / "regress" / "gold.nun")],
                             capture_output=True, text=True)
          print(r.stdout, r.stderr)
          if "solver not available" in r.stderr:
              die("the packaged wrapper cannot see its bundled solvers: " + r.stderr.strip())
          if not r.stdout.startswith("SAT"):
              die("the packaged component did not answer SAT on gold.nun: " + r.stdout[:200])
      else:
          # NOT a claim that someone else already checked these.  On win-64 the
          # two binaries are Cygwin-ABI: they need cygwin1.dll, which lives in
          # the base `isabelle` RUN dependency and is absent from a build
          # environment, so nothing here can execute them.  What stands in for
          # it is versions-x86_64-cygwin.txt: the fork's win-64 leg captures
          # both --version lines under Isabelle's own bundled Cygwin, in this
          # component's layout, and release-nunchaku.yml asserts that record's
          # version and 40-hex commit fields against the release tag BEFORE it
          # stages either binary here.  cvc5 is native on every platform, so its
          # pin is asserted above on all five.
          #
          # Which hops the win-64 BYTES are covered on, since nothing executes
          # them: the fork's leg digests both binaries where it built them and
          # ships the sidecars inside its artifact; release-attach.sh verifies
          # those digests after the artifact round trip and re-uses the same hex
          # under the released names; release-nunchaku.yml's staging step
          # verifies that sidecar again after downloading from the release, and
          # checks the PE signature.  So build -> artifact -> release ->
          # packaging is covered by digest at every hop; what no digest can say
          # is whether the bytes RUN, and that is what the run plan's
          # installed-wrapper step on a real Windows box is for.
          print(f"{TARGET}: nunchaku-bin and smbc are Cygwin-ABI binaries and "
                "cannot run in a build environment; their versions and the "
                "nunchaku commit are asserted from versions-x86_64-cygwin.txt "
                "by release-nunchaku.yml's staging step.")

      # ------------------------------------------------------------------
      # licenses
      # ------------------------------------------------------------------
      # Three bundled works, three licence texts.  smbc is the one 0.5.3 starts
      # redistributing, and its LICENSE is fetched as a pinned source above
      # because the built binary carries no licence text of its own.
      (dest / "COMMIT").write_text(f"base {BASE}\nbuild {head}\n", newline="\n")
      shutil.copyfile(SRC / "LICENSE", dest / "LICENSE")
      shutil.copyfile(SRC / "cvc5-dist" / "COPYING", dest / "LICENSE-cvc5")
      shutil.copyfile(SRC / "smbc-LICENSE", dest / "LICENSE-smbc")

      # ------------------------------------------------------------------
      # Link hooks: register with `isabelle components -u` on install,
      # unregister with -x on removal.
      # ------------------------------------------------------------------
      # BOTH families are written unconditionally, on every subdir.  conda picks
      # by the RUNNING platform and returns success IN SILENCE when the file is
      # absent, so a .sh-only package installs cleanly on Windows, shows up in
      # `conda list`, and is never registered.  This is an arch package, so a
      # target_platform guard would actually work here -- write both anyway: two
      # files is one fewer class of "a fix that looks applied and isn't".
      #
      # Every hook exits 0 unconditionally.  A nonzero post-link makes conda
      # roll the whole install back (measured, isabelle-packaging-ci run
      # 29637825807); a failed registration merely surfaces later as a clear
      # "component unavailable".
      #
      # The .bat below is the measured one from
      # contrib/Performant_Isabelle_ML/conda/recipe.yaml, verified on a real
      # windows-latest runner including a prefix with spaces and one on a
      # non-C: drive.  What is load-bearing in it:
      #   * CRLF line endings, and `exit /b 0` on every path.
      #   * The path goes over in CYGWIN form.  `isabelle components` parses it
      #     with Path.explode, whose Path.check_elem rejects `:` and `\`, so a
      #     native `%PREFIX%\share\...` raises "Illegal character" -- and with
      #     the mandatory `exit /b 0` that failure is invisible, i.e. exactly as
      #     broken as shipping no .bat at all.  The conversion is pure batch
      #     substring/substitution because cygpath.exe printed NOTHING on a
      #     windows-latest runner.  The drive letter needs NO lowercasing.
      #   * The throwaway `getenv -b ISABELLE_HOME` warm-up is the difference
      #     between the hook working and silently doing nothing.  Cygwin heals
      #     itself on the FIRST isabelle call, but that call's Java classpath is
      #     computed before the heal completes -- so the first invocation is
      #     precisely the one that cannot run a Scala tool, and `components` IS
      #     a Scala tool ("Could not find or load main class isabelle.Components",
      #     measured on a cold prefix).  A bash-only subcommand absorbs the cold
      #     start.  Both hooks need it: install-then-immediately-remove leaves
      #     pre-unlink cold too.
      (PREFIX / "bin").mkdir(parents=True, exist_ok=True)
      (PREFIX / "Scripts").mkdir(parents=True, exist_ok=True)
      for action, verb in [("post-link", "-u"), ("pre-unlink", "-x")]:
          # $PREFIX stays literal: conda expands it at link time, not now.
          sh = PREFIX / "bin" / f".{NAME}-{action}.sh"
          # stderr goes to $PREFIX/.messages.txt, which conda prints, rather
          # than to /dev/null: the hook must still exit 0, so discarding the
          # reason left "may be unavailable" as the entire diagnosis of a failed
          # registration.
          sh.write_text("\n".join([
              '#!/bin/bash',
              f'"$PREFIX/isa/bin/isabelle" components {verb} "$PREFIX/share/{NAME}" \\',
              '    2>> "$PREFIX/.messages.txt" \\',
              f'  || echo "warning: \'isabelle components {verb} {NAME}\' failed; '
              'the nunchaku component may be unavailable (see .messages.txt)"',
              'exit 0',
          ]) + "\n", newline="\n")
          sh.chmod(0o755)

          bat = PREFIX / "Scripts" / f".{NAME}-{action}.bat"
          bat.write_text("\r\n".join([
              '@echo off',
              f'set "COMP=%PREFIX%\\share\\{NAME}"',
              'set "DL=%COMP:~0,1%"',
              'set "REST=%COMP:~2%"',
              'set "REST=%REST:\\=/%"',
              'set "CYG=/cygdrive/%DL%%REST%"',
              'call "%PREFIX%\\isa\\bin\\isabelle.bat" getenv -b ISABELLE_HOME >nul 2>&1',
              f'call "%PREFIX%\\isa\\bin\\isabelle.bat" components {verb} "%CYG%" >nul 2>&1',
              'exit /b 0', '',
          ]), newline="")

      # The hooks name the install path as a LITERAL, built from NAME rather
      # than from `dest`.  The three checks below are CANARIES, not gates: as
      # the code stands each of them compares a value with the expression it was
      # generated from a few lines earlier, so none of them can fail today.
      # They exist so that a future edit which moves the component, or which
      # writes the hook text from something other than NAME, fails here -- where
      # the diagnosis is one line -- instead of shipping a package whose
      # `exit /b 0` hook silently points at the old place.  Keep them.
      if f"share/{NAME}" not in (PREFIX / "bin" / f".{NAME}-post-link.sh").read_text():
          die("the post-link hook does not name the component directory")
      if b"\r\n" not in (PREFIX / "Scripts" / f".{NAME}-post-link.bat").read_bytes():
          die("the .bat hook is not CRLF")
      if dest != PREFIX / "share" / NAME:
          die("the component was not written where the hooks say it is")

tests:
  # Runs against a fresh environment with the package installed -- so a
  # hand-run `rattler-build build` validates the artifact, not just the build
  # prefix.  (The isabelle end-to-end assertion lives in the release workflow's
  # post-publish smoke; these stay self-contained.)
  #
  # A HAND-RUN LEAVES A STALE REGISTRATION IN YOUR OWN ~/.isabelle.  Measured
  # 2026-08-25, rattler-build 0.69.1: rattler runs the package's automatic
  # post-link in the test environment with the INVOKING USER'S HOME, and never
  # runs the matching pre-unlink at teardown -- so every `rattler-build build`
  # of this recipe adds one entry to
  #   $HOME/.isabelle/Isabelle2025-2-conda-<envdir>/etc/components
  # pointing at a rattler temp prefix that is then deleted, after which every
  # `isabelle` call in a conda environment directory of that name prints
  # "### Missing Isabelle component: ...".  The round trip inside the test
  # script below does NOT cure this: it runs under its own HOME inside $PREFIX.
  # Clean it by hand -- delete the offending lines from that file -- or run
  # builds in a container.  CI runners are ephemeral, so publish safety is
  # unaffected.
  - script:
      # Python for the same reason the build script uses it: on win-64 the
      # default test shell is cmd, and `test -x` is not a cmd builtin.  python
      # is pulled into the TEST environment only, by the requirements below.
      interpreter: python
      content: |
        import os, pathlib, re, subprocess

        NAME   = "isabelle-nunchaku"
        PREFIX = pathlib.Path(os.environ["PREFIX"])
        comp   = PREFIX / "share" / NAME

        # The three pins, bound once.  rattler-build validates this script's
        # template at parse time but substitutes the values when it materialises
        # the test, so by the time this runs they are the rendered strings.
        # Bound to names rather than written inline: a template expression and a
        # python f-string both want braces, and keeping them apart is cheaper
        # than reasoning about what happens when they meet.
        WANT_VERSION = "${{ version }}"
        WANT_CVC5    = "${{ cvc5_version }}"
        WANT_SMBC    = "${{ smbc_version }}"

        def die(msg):
            print(f"::error::{msg}")
            raise SystemExit(1)

        # Derive the platform directory from etc/settings rather than restating
        # it: this asserts the settings line and locates the payload in one
        # move, so a package whose settings named a directory it does not ship
        # fails right here.
        settings = (comp / "etc" / "settings").read_text()
        m = re.search(r'^NUNCHAKU_HOME="\$COMPONENT/([^"]+)"$', settings, re.M)
        if not m:
            die(f"etc/settings has no usable NUNCHAKU_HOME line:\n{settings}")
        plat = m.group(1)
        exe = ".exe" if plat.endswith("-cygwin") else ""
        print("platform directory:", plat)

        for rel in ["nunchaku", f"nunchaku-bin{exe}",
                    f"solvers/cvc5{exe}", f"solvers/smbc{exe}"]:
            if not (comp / plat / rel).is_file():
                die(f"{plat}/{rel} is not in the package")
        for rel in ["LICENSE", "LICENSE-cvc5", "LICENSE-smbc"]:
            if not (comp / rel).is_file():
                die(f"{rel} is not in the package")

        if 'NUNCHAKU_VERSION="' + WANT_VERSION + '"' not in settings:
            die("etc/settings does not carry NUNCHAKU_VERSION=" + WANT_VERSION)

        commit = (comp / "COMMIT").read_text()
        for line in ("base", "build"):
            if not re.search(rf"^{line} [0-9a-f]{{40}}$", commit, re.M):
                die(f"COMMIT lacks the {line} line:\n{commit}")

        # Both hook families, on every subdir -- see the build script.
        for rel in [f"bin/.{NAME}-post-link.sh", f"bin/.{NAME}-pre-unlink.sh",
                    f"Scripts/.{NAME}-post-link.bat", f"Scripts/.{NAME}-pre-unlink.bat"]:
            if not (PREFIX / rel).is_file():
                die(f"the {rel} link hook is missing")
        if b"\r\n" not in (PREFIX / f"Scripts/.{NAME}-post-link.bat").read_bytes():
            die("the .bat hook is not CRLF")

        # ------------------------------------------------------------------
        # the hooks must REGISTER, not merely exist
        # ------------------------------------------------------------------
        # Until this block, nothing anywhere observed a link hook's EFFECT
        # before the bytes reached an immutable channel.  Every hook exits 0 by
        # design (a nonzero post-link makes conda roll the whole install back)
        # and the .bat sends both `call`s to >nul 2>&1, so a registration
        # failure -- a wrong isabelle.bat path, a lost warm-up line, a lost CRLF
        # -- was silent by construction on all five subdirs, and the first thing
        # that would have noticed is the post-publish smoke, which runs after
        # the channel refuses to let the bytes be replaced.
        #
        # The hooks are invoked EXPLICITLY rather than relying on the automatic
        # post-link rattler-build already runs: rattler does run link scripts in
        # the test environment, but it gives the hook the INVOKING USER'S HOME
        # and this script a different one (measured 2026-08-25, rattler-build
        # 0.69.1), so the automatic run's effect is invisible from here and
        # asserting on it would be a false red.  One environment for hook and
        # probe, with a HOME inside $PREFIX, and the round trip is observable.
        #
        # This does NOT cure the stale registration a hand-run leaves in the
        # BUILDER's own ~/.isabelle (see the note above `tests:`): that comes
        # from rattler's automatic post-link under the real HOME, and nothing
        # here runs the matching pre-unlink for it.
        #
        # Entry point is <prefix>/bin/isabelle or <prefix>/Scripts/isabelle.bat,
        # never <prefix>/isa/bin/isabelle -- the distribution's unix launcher
        # ships on Windows too and Git-Bash calls it executable
        # (RELEASE_CHECKLIST.md section 7).  `cmd /c` is safe from python: no
        # MSYS path rewriting, so the Git-Bash trap in that same section does
        # not apply.
        env = dict(os.environ)
        env["PREFIX"] = str(PREFIX)
        home = PREFIX / ".test-home"
        home.mkdir(exist_ok=True)
        env["HOME"] = str(home)
        env["USERPROFILE"] = str(home)
        if exe:                                   # x86_64-cygwin
            isa  = ["cmd", "/c", str(PREFIX / "Scripts" / "isabelle.bat")]
            post = ["cmd", "/c", str(PREFIX / "Scripts" / f".{NAME}-post-link.bat")]
            pre  = ["cmd", "/c", str(PREFIX / "Scripts" / f".{NAME}-pre-unlink.bat")]
        else:
            isa  = [str(PREFIX / "bin" / "isabelle")]
            post = ["bash", str(PREFIX / "bin" / f".{NAME}-post-link.sh")]
            pre  = ["bash", str(PREFIX / "bin" / f".{NAME}-pre-unlink.sh")]

        def registered_version():
            r = subprocess.run(isa + ["getenv", "-b", "NUNCHAKU_VERSION"],
                               capture_output=True, text=True, env=env)
            return r.stdout.strip().replace("\r", "")

        subprocess.run(post, env=env, check=True)
        after_post = registered_version()
        print("after post-link: NUNCHAKU_VERSION =", repr(after_post))
        if after_post != WANT_VERSION:
            die("the post-link hook ran but did not register the component: "
                "NUNCHAKU_VERSION is '" + after_post + "'")
        subprocess.run(pre, env=env, check=True)
        after_pre = registered_version()
        print("after pre-unlink: NUNCHAKU_VERSION =", repr(after_pre))
        if after_pre == WANT_VERSION:
            die("the pre-unlink hook ran but left the component registered")

        # cvc5 is native everywhere and must satisfy the pin.  nunchaku-bin and
        # smbc are Cygwin-ABI on x86_64-cygwin and need cygwin1.dll from the
        # base isabelle package's own Cygwin, so they are exercised by the
        # fork's win-64 release leg instead of here.
        out = subprocess.run([str(comp / plat / "solvers" / f"cvc5{exe}"), "--version"],
                             capture_output=True, text=True, check=True)
        cvc5_line = out.stdout.splitlines()[0]
        print("cvc5:", cvc5_line)
        # The trailing space is measured: the line is
        # "cvc5 1.3.4 [git f3b21c4 on branch HEAD]".  Without it the test also
        # accepts cvc5 1.3.44.
        if "cvc5 " + WANT_CVC5 + " " not in cvc5_line:
            die("bundled cvc5 reports '" + cvc5_line + "', expected cvc5 " + WANT_CVC5)

        if exe == "":
            smbc = subprocess.run([str(comp / plat / "solvers" / "smbc"), "--version"],
                                  capture_output=True, text=True, check=True)
            smbc_line = (smbc.stdout + smbc.stderr).splitlines()[0]
            print("smbc:", smbc_line)
            # Exact, not a substring: the measured line is "version: 0.6.1", and
            # a substring test also accepts "version: 0.6.11".
            if smbc_line != "version: " + WANT_SMBC:
                die("bundled smbc reports '" + smbc_line + "', expected 'version: " + WANT_SMBC + "'")
            subprocess.run([str(comp / plat / "nunchaku"), "--help"],
                           check=True, stdout=subprocess.DEVNULL)

        print("  OK ", plat, "layout, both hook families round-tripped, solver pins")
    requirements:
      run:
        - python

requirements:
  build:
    # The build script is python (see build.script.interpreter) and its
    # provenance assertions shell out to git.  Declaring both makes them
    # present by construction on all five platforms rather than by whatever
    # the runner image happens to put on PATH.
    - python
    - git
  run:
    # Bounded to the Isabelle series this component is certified against
    # (house rule: without the bound, conda's newest-wins pairs it with a
    # future Isabelle it was never tested with).
    - isabelle >=2025.2,<2025.3

about:
  homepage: https://github.com/xqyww123/nunchaku
  summary: "Nunchaku model finder for Isabelle (maintained fork + cvc5 + smbc), as an Isabelle component"
  description: |
    A maintained build of the Nunchaku counterexample finder (fork of
    nunchaku-inria/nunchaku, pinned upstream base in COMMIT), bundled with a
    static cvc5 and smbc and registered as an Isabelle component.  Makes the
    Isabelle2025-2 `nunchaku` command work out of the box; sets
    NUNCHAKU_VERSION for version-gated programmatic consumers.
  # The BUNDLE's licence, not the fork's alone: this package redistributes three
  # works.  Measured 2026-08-25: the fork's own LICENSE is two-clause BSD;
  # c-cube/smbc@v0.6.1's LICENSE is two-clause (no "Neither the name" clause);
  # cvc5-1.3.4's COPYING is the modified, three-clause BSD.  `BSD-2-Clause`
  # alone was wrong for the bundle even before smbc joined it.
  license: BSD-2-Clause AND BSD-3-Clause
  # Without this, info/licenses/ is absent from the built package, which is
  # where conda tooling looks for the texts.
  license_file:
    - LICENSE
    - cvc5-dist/COPYING
    - smbc-LICENSE
  repository: https://github.com/xqyww123/nunchaku
